  <link rel="stylesheet" href="../css/style.css">
  <style>
    .featured-ach-option { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; transition:border-color 0.12s, background 0.12s; }
    .featured-ach-option.selected { border-color:var(--sky-dark); background:var(--sky-pale); }
    .featured-ach-check { width:20px; height:20px; border-radius:4px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; color:#fff; }
    .featured-ach-option.selected .featured-ach-check { background:var(--sky-dark); border-color:var(--sky-dark); }

    /* [2026-09-22] scope 탭 — 종족연구소/LABBER */
    .achievement-scope-tabs { display:flex; gap:8px; margin-top:16px; }
    .achievement-scope-tab {
      padding:8px 18px; border-radius:999px; border:1.5px solid var(--border);
      background:var(--white); font-size:13px; font-weight:600; color:var(--text-mute);
      cursor:pointer; transition:border-color 0.12s, background 0.12s, color 0.12s;
    }
    .achievement-scope-tab.active { background:var(--sky-dark); border-color:var(--sky-dark); color:#fff; }
    .achievement-scope-empty { padding:56px 16px; text-align:center; color:var(--text-mute); font-size:14px; }

    /* [2026-09-22] LABBER 탭 테마 — 새 색상 없음. body.labber-theme가 --white/--text/--border/
       --sky-* 등을 이미 리스킨하므로 .achievement-* 대부분은 별도 오버라이드 없이 자동 적용됨
       (css/scss/_labber-shop.scss의 "하드코딩된 라이트 색만 override" 패턴을 그대로 따름).
       아래 3개만 style.scss에 하드코딩된 값이라 LABBER 스코프에서만 기존 LABBER 변수/색으로 교체. */
    body.labber-theme #pageContent .ach-icon-wrap {
      background: var(--sky-pale);   /* 원래 #F1F5F9 하드코딩 — LABBER 관리소/상점과 동일 패턴 */
    }
    body.labber-theme #pageContent .achievement-progress-fill {
      /* 원래 라이트블루 하드코딩 그라디언트 → body.labber-theme가 정의한 --sky 3단계 그대로 재사용 */
      background: linear-gradient(90deg, var(--sky-deep), var(--sky-dark), var(--sky));
    }
    body.labber-theme #pageContent .achievement-progress-fill.complete {
      /* LABBER 관리소 .labber-trait-grade.is-special의 기존 앰버 조합(#3a3316/#e8c96b) 재사용 */
      background: linear-gradient(90deg, #3a3316, #e8c96b);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">종족연구소</a>
      <nav class="header-nav">
        <a href="login.html" class="btn-login">로그인</a>
      </nav>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">

      <div id="pageLoading" class="page-loading">불러오는 중...</div>

      <div id="pageContent" style="display:none;">

        <div style="padding: 24px 0 0; display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <div>
            <div class="breadcrumb">
              <a href="index.html">홈</a>
              <span>/</span>
              <span id="breadcrumbName">업적</span>
            </div>
            <h1 class="list-page-title" id="pageTitle" style="margin-top: 8px;">업적</h1>
          </div>
          <button class="btn-ghost" id="editFeaturedBtn" onclick="openFeaturedModal()" style="display:none; font-size:13px; margin-bottom:4px;">대표 업적 편집</button>
        </div>

        <!-- scope 탭 -->
        <div class="achievement-scope-tabs" id="achievementScopeTabs">
          <button type="button" class="achievement-scope-tab active" data-scope="specieslab" onclick="switchScope('specieslab')">종족연구소</button>
          <!-- LABBER 탭: LABBER 업적이 실제로 조회될 때만 loadAchievements 가 표시 (공개 여부는 DB RLS 가 결정) -->
          <button type="button" class="achievement-scope-tab" id="labberScopeTab" data-scope="labber" onclick="switchScope('labber')" style="display:none;">LABBER</button>
        </div>

        <!-- 달성률 -->
        <div class="achievement-stats" id="achievementStats" style="margin-top: 16px;">
          <div class="achievement-stats-row">
            <span class="achievement-stats-count" id="achievementStatsText"></span>
            <span class="achievement-stats-pct" id="achievementPct"></span>
          </div>
          <div class="achievement-progress-bar">
            <div class="achievement-progress-fill" id="achievementProgressFill" style="width:0%"></div>
          </div>
        </div>

        <!-- 업적 목록 -->
        <div id="achievementCategories" class="achievement-categories"></div>
        <p id="achievementEmpty" class="empty-state" style="display:none;">업적을 불러오지 못했어요.</p>
        <p id="achievementScopeEmpty" class="achievement-scope-empty" style="display:none;">아직 기록된 LABBER 업적이 없습니다.</p>

      </div>

    </main>

  <!-- 대표 업적 편집 모달 -->
  <div id="featuredAchModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:500; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:16px; padding:24px; width:min(100%,480px); max-height:82vh; display:flex; flex-direction:column; gap:14px; box-shadow:0 8px 32px rgba(0,0,0,0.16);">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h3 style="margin:0; font-size:16px; font-weight:700;">대표 업적 선택</h3>
        <span style="font-size:12px; color:var(--text-mute);" id="featuredSelCount">0 / 4 선택</span>
      </div>
      <p style="margin:0; font-size:12px; color:var(--text-mute);">프로필에 표시할 업적을 최대 4개 선택하세요. 선택 순서대로 표시됩니다.</p>
      <div id="featuredAchList" style="overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:6px; max-height:400px;"></div>
      <p class="auth-error" id="featuredAchError"></p>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn-ghost" onclick="closeFeaturedModal()">취소</button>
        <button class="btn-secondary" id="featuredSaveBtn" onclick="saveFeaturedAchievements()">저장</button>
      </div>

  <script>
    const viewNick = new URLSearchParams(window.location.search).get('user');
    let currentAchUser = null;

    // [2026-09-22] 카테고리 하드코딩 제거 — achievement_categories 테이블 기반으로 전환.
    // CATEGORY_MAP/GONG_O_CODES/CATEGORY_ORDER는 더 이상 사용하지 않음(DB에서 조회).
    let _allAch      = [];   // achievements 전체(scope 무관)
    let _allCats     = [];   // achievement_categories 전체(scope 무관)
    let _earnedMap   = new Map();  // achievement_code -> unlocked_at
    let _currentScope = 'specieslab';
    // [2026-10-01] LABBER 업적 공개 — LABBER scope 업적이 조회되면(=RLS 공개) 탭을 보여준다.
    let _labberVisible = false;

    // is_secret 카테고리 공용 규칙(구 GONG_O_CODES 하드코딩 대체):
    // 해당 카테고리 업적을 뷰어가 하나도 획득 못 했으면 이름 자체를 "???"로 감춘다.
    function categoryDisplay(cat, earnedInCategory) {
      const hidden = cat.is_secret && earnedInCategory === 0;
      return {
        name:      hidden ? '??? 업적' : cat.name,
        shortName: hidden ? '???'      : cat.short_name,
      };
    }

    function showPage() {
      document.getElementById('pageLoading').style.display = 'none';
      document.getElementById('pageContent').style.display  = 'block';
    }

    // ── 대표 업적 편집 모달 ─────────────────────────────
    let _featuredSelected = [];
    let _modalEarned      = [];
    let _modalDateMap     = {};

    async function openFeaturedModal() {
      try {
        const { data: myAch } = await sb
          .from('user_achievements')
          .select('achievement_code, unlocked_at')
          .eq('user_id', currentAchUser.id)
          .order('unlocked_at', { ascending: false });

        if (!myAch?.length) { alert('아직 획득한 업적이 없어요.'); return; }

        const codes = myAch.map(a => a.achievement_code);
        _modalDateMap = Object.fromEntries(myAch.map(a => [a.achievement_code, a.unlocked_at]));

        const [{ data: details }, { data: profile }] = await Promise.all([
          sb.from('achievements').select('code, name, description').in('code', codes),
          sb.from('user_profiles').select('featured_achievements')
            .eq('user_id', currentAchUser.id)
            .maybeSingle(),
        ]);

        _modalEarned       = details || [];
        _featuredSelected  = [...(profile?.featured_achievements || [])].filter(c => codes.includes(c));

        _renderFeaturedModal();
        document.getElementById('featuredAchModal').style.display = 'flex';
      } catch (e) {
        console.error('[대표 업적] 모달 오류:', e);
      }
    }

    function _renderFeaturedModal() {
      document.getElementById('featuredSelCount').textContent  = `${_featuredSelected.length} / 4 선택`;
      document.getElementById('featuredAchError').textContent  = '';
      document.getElementById('featuredAchList').innerHTML = _modalEarned.map(a => {
        const isSel = _featuredSelected.includes(a.code);
        const date  = new Date(_modalDateMap[a.code]).toLocaleDateString('ko-KR', {
          year: 'numeric', month: '2-digit', day: '2-digit'
        }).replace(/\. /g, '.').replace(/\.$/, '');
        return `
          <div class="featured-ach-option${isSel ? ' selected' : ''}" onclick="toggleFeaturedAch('${a.code}')">
            <div class="featured-ach-check">${isSel ? '✓' : ''}</div>
            <div class="achievement-item-body">
              <p class="achievement-item-name">${a.name}</p>
              <p class="achievement-item-desc">${a.description || ''}</p>
            </div>
            <span class="achievement-item-date">${date}</span>
          </div>`;
      }).join('');
    }

    function toggleFeaturedAch(code) {
      const errorEl = document.getElementById('featuredAchError');
      errorEl.textContent = '';
      if (_featuredSelected.includes(code)) {
        _featuredSelected = _featuredSelected.filter(c => c !== code);
      } else {
        if (_featuredSelected.length >= 4) {
          errorEl.textContent = '최대 4개까지 선택할 수 있어요.';
          return;
        }
        _featuredSelected.push(code);
      }
      _renderFeaturedModal();
    }

    function closeFeaturedModal() {
      document.getElementById('featuredAchModal').style.display = 'none';
    }

    async function saveFeaturedAchievements() {
      const btn     = document.getElementById('featuredSaveBtn');
      const errorEl = document.getElementById('featuredAchError');
      btn.textContent = '저장 중...';
      btn.disabled    = true;

      const nickname = currentAchUser.user_metadata?.display_name || currentAchUser.user_metadata?.nickname;

      // 저장 측 검증: 실제 획득한 업적만, 선택 순서 유지, 최대 4개
      const earnedCodes = new Set(_modalEarned.map(a => a.code));
      const payloadCodes = _featuredSelected.filter(c => earnedCodes.has(c)).slice(0, 4);

      const { error } = await sb.from('user_profiles').upsert(
        { user_id: currentAchUser.id, nickname, featured_achievements: payloadCodes },
        { onConflict: 'user_id' }
      );

      if (error) {
        console.error('[대표 업적] 저장 실패:', error.code, '|', error.message, '|', error.details, '|', error.hint);
        errorEl.textContent = '저장에 실패했어요. 다시 시도해주세요.';
      } else {
        _featuredSelected = payloadCodes;
        closeFeaturedModal();
      }
      btn.textContent = '저장';
      btn.disabled    = false;
    }

    // ── 업적 렌더링 ─────────────────────────────────────
    function renderCard(a) {
      const date = a.isEarned
        ? new Date(a.unlockedAt).toLocaleDateString('ko-KR', {
            year: 'numeric', month: '2-digit', day: '2-digit'
          }).replace(/\. /g, '.').replace(/\.$/, '')
        : null;

      if (a.isEarned) {
        return `
          <div class="achievement-item earned">
            <div class="ach-icon-wrap transparent">
              <img src="../images/achievement-badge.png" class="ach-icon" alt="업적">
            </div>
            <div class="achievement-item-body">
              <p class="achievement-item-name">${a.name}</p>
              <p class="achievement-item-desc">${a.description || ''}</p>
            </div>
            <div class="achievement-item-right">
              <span class="achievement-item-reward">
                <img src="../images/icons/currency-record.png" class="ach-reward-icon" alt="연구기록">
                +${(a.scope === 'labber' && a.reward_override != null) ? a.reward_override : (a.is_hidden ? 10 : 5)}
              </span>
              <span class="achievement-item-date">${date}</span>
            </div>
          </div>`;
      }
      if (a.is_hidden) {
        return `
          <div class="achievement-item locked" style="opacity:0.35;">
            <div class="ach-icon-wrap"></div>
            <div class="achievement-item-body">
              <p class="achievement-item-name">???</p>
              <p class="achievement-item-desc">???</p>
            </div>
            <span class="achievement-item-status">숨겨진 업적</span>
          </div>`;
      }
      return `
        <div class="achievement-item locked">
          <div class="ach-icon-wrap"></div>
          <div class="achievement-item-body">
            <p class="achievement-item-name">${a.name}</p>
            <p class="achievement-item-desc">${a.description || ''}</p>
          </div>
          <span class="achievement-item-status">미획득</span>
        </div>`;
    }

    async function loadAchievements(userId) {
      try {
        const [{ data: allAch, error: achErr }, { data: cats, error: catErr }, { data: myAch }] = await Promise.all([
          sb.from('achievements').select('*').order('sort_order'),
          sb.from('achievement_categories').select('*').order('sort_order'),
          sb.from('user_achievements').select('achievement_code, unlocked_at').eq('user_id', userId),
        ]);

        console.log('[업적] 전체:', allAch?.length, achErr || '', '/ 카테고리:', cats?.length, catErr || '');

        if (achErr || catErr || !allAch || allAch.length === 0) {
          document.getElementById('achievementEmpty').style.display = 'block';
          return;
        }

        // LABBER 탭은 LABBER 업적이 있을 때만. specieslab/LABBER 는 scope + category 로 분리 렌더(탐험 업적 등에 섞이지 않음).
        _labberVisible = allAch.some(a => a.scope === 'labber');
        document.getElementById('labberScopeTab').style.display = _labberVisible ? '' : 'none';
        _allAch    = _labberVisible ? allAch : allAch.filter(a => a.scope !== 'labber');
        _allCats   = _labberVisible ? (cats || []) : (cats || []).filter(c => c.scope !== 'labber');
        const shownCodes = new Set(_allAch.map(a => a.code));
        _earnedMap = new Map((myAch || []).filter(a => shownCodes.has(a.achievement_code))
                                          .map(a => [a.achievement_code, a.unlocked_at]));

        renderScope(_currentScope);

      } catch (e) {
        console.error('[업적] 로드 오류:', e);
        document.getElementById('achievementEmpty').style.display = 'block';
      }
    }

    // [2026-09-22] scope 탭 전환 — 재조회 없이 캐시된 데이터로 재렌더링만 한다.
    function switchScope(scope) {
      if (scope === 'labber' && !_labberVisible) return;   // LABBER 업적이 없으면 전환하지 않음
      if (scope === _currentScope) return;
      _currentScope = scope;
      document.querySelectorAll('.achievement-scope-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scope === scope);
      });
      renderScope(scope);
    }

    // 선택된 scope 기준으로 진행률/카테고리/업적 목록을 렌더링한다.
    function renderScope(scope) {
      // LABBER 탭 = 기존 LABBER 페이지(labber-lab.html 등)와 동일한 body.labber-theme 토글.
      // 새 테마를 만들지 않고 _labber.scss가 이미 정의한 다크·민트 리스킨을 그대로 재사용한다.
      // toggle 사용 → 종족연구소로 돌아오면 클래스가 제거되어 기본 테마로 완전히 복구됨.
      document.body.classList.toggle('labber-theme', scope === 'labber');

      const scopedAch  = _allAch.filter(a => a.scope === scope);
      const scopedCats = _allCats.filter(c => c.scope === scope).sort((a, b) => a.sort_order - b.sort_order);
      // 같은 scope 카테고리에 매칭되지 않는 업적은 다른 영역(예: 탐험 업적)으로 보내지 않고 미표시 + 경고만.
      const scopedCatCodes = new Set(scopedCats.map(c => c.code));
      scopedAch.filter(a => !scopedCatCodes.has(a.category)).forEach(a =>
        console.warn('[업적] scope 내 카테고리 없음 — 미표시:', scope, a.code, a.category));

      const statsEl     = document.getElementById('achievementStats');
      const catsEl       = document.getElementById('achievementCategories');
      const scopeEmptyEl = document.getElementById('achievementScopeEmpty');

      if (scopedAch.length === 0) {
        statsEl.style.display      = 'none';
        catsEl.innerHTML           = '';
        scopeEmptyEl.style.display = 'block';
        return;
      }
      scopeEmptyEl.style.display = 'none';
      statsEl.style.display      = '';

      const earnedCount = scopedAch.filter(a => _earnedMap.has(a.code)).length;
      const totalCount  = scopedAch.length;
      const pct         = totalCount > 0 ? Math.floor((earnedCount / totalCount) * 100) : 0;

      document.getElementById('achievementStatsText').textContent = `${earnedCount} / ${totalCount} 달성`;
      document.getElementById('achievementPct').textContent       = `${pct}%`;
      const fillEl = document.getElementById('achievementProgressFill');
      fillEl.style.width = `${pct}%`;
      fillEl.classList.toggle('complete', pct === 100);   // 탭 전환 시 이전 scope의 complete 상태가 남지 않도록 toggle 사용

      catsEl.innerHTML = scopedCats.map(cat => {
        const items = scopedAch
          .filter(a => a.category === cat.code)
          .sort((a, b) => a.sort_order - b.sort_order)
          .map(a => ({ ...a, unlockedAt: _earnedMap.get(a.code), isEarned: _earnedMap.has(a.code) }));
        if (items.length === 0) return '';

        const earnedInCat  = items.filter(a => a.isEarned).length;
        const { name }      = categoryDisplay(cat, earnedInCat);

        return `
          <div class="ach-category">
            <div class="ach-category-header">
              <h3 class="ach-category-title">${name}</h3>
              <span class="ach-category-count">${earnedInCat} / ${items.length}</span>
            </div>
            <div class="achievement-list">${items.map(renderCard).join('')}</div>
          </div>`;
      }).join('');
    }

    async function initPage() {
      try {
        const user = await getUser();
        if (!user) { window.location.href = 'login.html'; return; }

        if (viewNick) {
          // 본인이 ?user= 파라미터로 접근한 경우 → 클린 URL로 리다이렉트
          const myNickname = user.user_metadata?.display_name || user.user_metadata?.nickname;
          if (viewNick === myNickname) {
            window.location.replace('achievements.html');
            return;
          }
          // 타인 접근 → 상세 차단
          document.getElementById('achievementStats').style.display = 'none';
          document.getElementById('achievementScopeTabs').style.display = 'none';
          showPage();
          const el = document.getElementById('achievementEmpty');
          el.textContent   = '다른 유저의 업적 상세는 확인할 수 없어요.';
          el.style.display = 'block';
        } else {
          currentAchUser = user;
          document.getElementById('editFeaturedBtn').style.display = '';
          showPage();
          // LABBER 업적 소급/재확인(서버 판정·멱등). 지급 스위치 off 면 서버가 즉시 locked 반환.
          await window.syncLabberAchievements?.();
          await loadAchievements(user.id);

          // 기존 유저 own_variety 체크 — 세션당 1회만 실행 (중복 Supabase 호출 방지)
          if (!sessionStorage.getItem('_own_variety_checked')) {
            sessionStorage.setItem('_own_variety_checked', '1');
            const _ds = await window.getDistinctOwnedSpeciesCount?.() || 0;
            if (_ds >= 5)  window.awardAchievement?.('own_variety_5');
            if (_ds >= 10) window.awardAchievement?.('own_variety_10');
            if (_ds >= 20) window.awardAchievement?.('own_variety_20');
          }
        }
      } catch (e) {
        console.error('[업적] initPage 오류:', e);
        showPage();
      }
    }

    initPage();
  </script>
</body>
</html>
