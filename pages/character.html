  <style>
    .step-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      max-width: 100%;
      overflow-wrap: break-word;
      transition: background .15s, border-color .15s, color .15s;
    }
    .step-btn.active {
      background: var(--sky-deep);
      border-color: var(--sky-deep);
      color: #fff;
    }
    .char-gallery-section { margin-top: 28px; }
    .char-gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .char-gallery-title { margin: 0; font-size: 17px; font-weight: 700; }
    .gallery-tile {
      display: block;
      width: 100%;
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: #F8FAFC;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    .gallery-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-empty { color: var(--text-mute); font-size: 13px; padding: 4px 0 0; }

    /* LABBER SUBJECT 연구 기록 카드 (LABBER 개체 상세 전용 — 오른쪽 개체 정보 칼럼 안, 정보 목록 아래 ~ 관리 버튼 위)
       compact 가로형: [아트웍] | 이름 ......... LV / (종류) / EXP / 바.
       아트웍이 없거나 로드에 실패해도 같은 크기의 "아트웍 없음" placeholder 를 두어 카드 크기가 변하지 않는다.
       CSS 변수만 사용 → body.labber-theme 리스킨이 그대로 적용된다. */
    .labber-subject-section { margin: 0; }
    .labber-subject-title { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
    .labber-subject-card {
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: flex-start;   /* 이미지를 세로 중앙이 아니라 카드 내용 상단 기준으로 정렬(오른쪽 이름/LV 시작 위치와 맞춤) */
      gap: 14px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
    }
    .labber-subject-img {
      position: relative;
      flex: 0 0 auto;
      width: 100px;
      height: 100px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: transparent;   /* 투명 PNG 아트웍은 뒤의 카드 배경이 그대로 비쳐야 한다 */
    }
    .labber-subject-img img { width: 100%; height: 100%; object-fit: cover; display: block; background: transparent; }
    .labber-subject-img.is-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      border-style: dashed;
      background: var(--sky-pale);   /* "아트웍 없음" placeholder 에만 은은한 배경 */
    }
    .labber-subject-img-empty { font-size: 11px; color: var(--text-mute); text-align: center; line-height: 1.4; padding: 4px; }
    .labber-subject-img .sensitive-overlay { background: var(--white); padding: 4px; }
    .labber-subject-body { flex: 1; min-width: 0; }
    .labber-subject-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .labber-subject-name { margin: 0; min-width: 0; font-size: 16px; font-weight: 700; color: var(--text); word-break: keep-all; overflow-wrap: anywhere; }
    .labber-subject-lv { flex: 0 0 auto; margin: 0; font-size: 13px; font-weight: 600; color: var(--text-sub); white-space: nowrap; }
    .labber-subject-type { margin: 1px 0 0; font-size: 12px; color: var(--text-mute); }
    .labber-subject-exp-text { margin: 8px 0 0; font-size: 12px; color: var(--text-mute); }
    .labber-subject-exp-bar {
      margin-top: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--sky-light);
      overflow: hidden;
    }
    .labber-subject-exp-bar.is-max { margin-top: 10px; }
    .labber-subject-exp-fill { height: 100%; border-radius: 999px; background: var(--sky-deep); }
    /* SUBJECT 제작자 / 연결 종족 — 개체 자체의 디자이너/아티스트(개체 정보 영역)와 구분되도록 카드 안 작은 글씨로만 표시 */
    .labber-subject-credits { margin: 8px 0 0; padding-top: 6px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
    .labber-subject-credit { margin: 0; font-size: 11px; line-height: 1.5; color: var(--text-mute); word-break: keep-all; overflow-wrap: anywhere; }
    .labber-subject-credit b { font-weight: 600; color: var(--text-sub); }
    /* 디자이너 / 아티스트 — 작고 연한 보조 텍스트. 항목 단위 flex-wrap(좁으면 다음 줄), 라벨은 bold, 닉네임 밑줄 없음 */
    .labber-subject-credit--people { display: flex; flex-wrap: wrap; column-gap: 12px; row-gap: 1px; font-size: 10px; opacity: 0.85; }
    .labber-subject-credit-item { min-width: 0; max-width: 100%; }
    .labber-subject-credit a { color: inherit; text-decoration: none; }
    .labber-subject-credit a:hover { color: var(--sky-deep); }
    /* 연결 종족 카드 — 작고 컴팩트한 링크 카드(SUBJECT 카드와 같은 테두리/라운드 톤). 카드 밖으로 넘치지 않게 min-width:0 + 말줄임 */
    .labber-subject-species-card {
      display: flex; align-items: center; gap: 8px;
      align-self: flex-start; max-width: 100%; box-sizing: border-box; min-width: 0;
      margin-top: 6px; padding: 4px 10px 4px 4px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--white);
      color: var(--text); text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .labber-subject-species-card:hover { border-color: var(--sky-deep); background: var(--sky-pale); }
    .labber-subject-species-thumb {
      flex: 0 0 auto; width: 28px; height: 28px; border-radius: 6px;
      background: var(--sky-pale) center / cover no-repeat; border: 1px solid var(--border);
    }
    .labber-subject-species-name { min-width: 0; font-size: 12px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 480px) {
      .labber-subject-card { gap: 10px; padding: 8px; }
      .labber-subject-img { width: 92px; height: 92px; }
    }
    /* 카드는 오른쪽 개체 정보 칼럼(.char-info-panel) 안, 정보 테이블 아래 ~ 관리 버튼 위에 놓인다.
       칼럼 폭을 그대로 사용(width:100%). 데스크톱은 칼럼이 좁아(전체의 45%) 아트웍만 살짝 줄여 답답하지 않게 맞춘다.
       모바일(767px 이하)은 칼럼이 전체폭이라 기존 크기 그대로. */
    @media (min-width: 768px) {
      .char-info-panel .labber-subject-img { width: 88px; height: 88px; }
    }

    /* 제작자 TOS (개인공지 재사용) — 기존 char_sections 탭 컴포넌트(.guide-tabs) 재사용 */
    /* 기본 접힘: 패널 숨김 + 탭 아래 경계선 제거해 빈 높이/여백이 남지 않게 */
    #tosTabs.is-collapsed .guide-tab-nav { border-bottom: none; }
    #tosTabs.is-collapsed .guide-tab-panels { display: none; }
    .tos-person + .tos-person {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .tos-person-name {
      display: inline-block;
      font-size: 14px;
      font-weight: 700;
      color: var(--sky-deep);
      text-decoration: none;
      margin-bottom: 6px;
    }
    .tos-person-name:hover { text-decoration: underline; }
    .tos-empty { color: var(--text-mute); font-size: 13px; margin: 0; }

    /* 개체 상세 — 등록명/소유주명 전환 탭. 클릭 영역은 넉넉히, 이름(28px/800)보다는 확실히 작게 유지 */
    /* 탭↔개체명 간격은 h1.char-page-name 자체의 margin-top(8px, style.scss)에게만 맡긴다 — 중복 방지 */
    .char-name-tabs { display: flex; gap: 8px; margin-top: 14px; }
    .char-name-tab {
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-mute);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .char-name-tab.active {
      background: var(--sky-pale);
      border-color: var(--sky-deep);
      color: var(--sky-deep);
    }
  </style>
</head>

  <script>
    // AdSense Auto ads 는 js/utils.js 의 loadAdSense() 를 정상 개체 콘텐츠 렌더 후에만 호출한다.

    const charId = new URLSearchParams(window.location.search).get('id');
    let afterDeleteHref = 'species-list.html';

    // 운영자 전용 특별 분류 뱃지 — characters.special_badge(key)에서만 채워짐.
    // 일반 유저 등록/수정 UI에는 입력 항목이 없고, 값 변경은 DB 트리거로 admin/staff만 가능.
    const SPECIAL_BADGE_MAP = {
      specieslab_collab: { label: '종족연구소 콜라보', className: 'collaboration' },
    };

    // char_sections 렌더링 직전 방어: data:/blob: 이미지만 제거 (Storage URL 등 외부 https 이미지는 그대로 표시)
    // DOMPurify 기본 설정은 img의 data: URI를 막지 않으므로, sanitize와 별개로 이 필터를 함께 적용한다.
    function stripUnsafeRenderedImages(html) {
      if (!html) return html;
      const div = document.createElement('div');
      div.innerHTML = html;
      div.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src') || '';
        if (src.startsWith('data:') || src.startsWith('blob:')) img.remove();
      });
      return div.innerHTML;
    }

    // 원본 이미지 토글 상태
    let _showingOriginal        = false;
    let _origImgUrl             = null;
    let _wmImgUrl               = null;
    let _origAdditionalUrls     = null;  // original_additional_images (on-demand 로드)

    // 성장 Step 버튼 클릭 — 이미지 있는 Step만 버튼으로 존재하므로 항상 안전하게 전환 가능
    // 캐릭터 상세 메인 이름 영역 전환 (등록명 ↔ 소유주 설정 이름). owner_custom_name이 있을 때만 탭이 노출된다.
    function setCharNameMode(mode) {
      if (!_charData || (mode === 'owner' && !_charData.owner_custom_name)) return;
      _nameDisplayMode = mode;

      const nameEl = document.getElementById('charPageName');
      if (nameEl) nameEl.textContent = mode === 'owner' ? _charData.owner_custom_name : _charData.name;

      document.querySelectorAll('.char-name-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
    }

    function selectCharStep(order) {
      _currentStep     = order;
      _showingOriginal = false;

      document.querySelectorAll('.step-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.stepOrder, 10) === order);
      });

      const imgEl = document.getElementById('charMainImg');
      if (imgEl) {
        if (order === _mainStepOrder) {
          imgEl.src = _charData.image_url;
        } else {
          const info = _stepImageMap[order];
          imgEl.src = info?.imageUrl || '';
        }
      }

      const label = document.getElementById('imgStateLabel');
      const btn   = document.getElementById('imgToggleBtn');
      if (label) label.textContent = '워터마크 이미지를 보고 있습니다.';
      if (btn)   { btn.textContent = '원본 이미지 보기'; btn.disabled = false; }
    }

    async function toggleOriginalImage() {
      const btn   = document.getElementById('imgToggleBtn');
      const label = document.getElementById('imgStateLabel');
      const imgEl = document.getElementById('charMainImg');
      if (!imgEl) return;

      // 대표 이미지 Step이 아니면: 해당 Step의 원본을 최초 클릭 시에만 온디맨드 조회 후 캐시
      if (_currentStep !== _mainStepOrder) {
        const stepInfo = _stepImageMap[_currentStep];
        if (!stepInfo) return;

        if (!_showingOriginal) {
          if (!_stepOriginalCache[_currentStep]) {
            btn.textContent = '불러오는 중...';
            btn.disabled    = true;
            const { data, error } = await sb.from('character_step_images')
              .select('original_image_url, image_url')
              .eq('character_id', charId)
              .eq('species_step_id', stepInfo.speciesStepId)
              .single();
            const origUrl = data?.original_image_url || data?.image_url || null;
            if (error || !origUrl) {
              btn.textContent = '원본 이미지 없음';
              return;
            }
            _stepOriginalCache[_currentStep] = origUrl;
          }
          _stepWmUrl        = imgEl.src;
          imgEl.src         = _stepOriginalCache[_currentStep];
          label.textContent = '원본 이미지를 보고 있습니다.';
          btn.textContent   = '워터마크 이미지 보기';
          btn.disabled      = false;
          _showingOriginal  = true;
        } else {
          imgEl.src         = _stepWmUrl || stepInfo.imageUrl;
          label.textContent = '워터마크 이미지를 보고 있습니다.';
          btn.textContent   = '원본 이미지 보기';
          _showingOriginal  = false;
        }
        return;
      }

      if (!_showingOriginal) {
        if (!_origImgUrl) {
          btn.textContent = '불러오는 중...';
          btn.disabled    = true;
          const { data, error } = await sb.from('characters')
            .select('original_image_url, original_additional_images').eq('id', charId).single();
          if (error || !data?.original_image_url) {
            btn.textContent = '원본 이미지 없음';
            return;
          }
          _origImgUrl         = data.original_image_url;
          _origAdditionalUrls = data.original_additional_images || null;
        }
        _wmImgUrl         = imgEl.src;
        imgEl.src         = _origImgUrl;
        label.textContent = '원본 이미지를 보고 있습니다.';
        btn.textContent   = '워터마크 이미지 보기';
        btn.disabled      = false;
        _showingOriginal  = true;

        // 추가 이미지도 원본으로 전환 (original이 있고 GIF가 아닌 인덱스만)
        document.querySelectorAll('[data-extra-idx]').forEach(el => {
          const idx     = parseInt(el.dataset.extraIdx);
          const origUrl = _origAdditionalUrls?.[idx];
          if (origUrl && !/\.gif(\?|$)/i.test(origUrl)) {
            el.dataset.wmSrc = el.src;
            el.src = origUrl;
          }
        });
      } else {
        imgEl.src         = _wmImgUrl;
        label.textContent = '워터마크 이미지를 보고 있습니다.';
        btn.textContent   = '원본 이미지 보기';
        _showingOriginal  = false;

        // 추가 이미지도 워터마크본으로 복원
        document.querySelectorAll('[data-extra-idx]').forEach(el => {
          if (el.dataset.wmSrc) {
            el.src = el.dataset.wmSrc;
            delete el.dataset.wmSrc;
          }
        });
      }
    }

    // 소유권 이전 모달 상태
    let _siteNicks      = new Set();
    let _nickToId       = {};
    let _idToNick       = {};
    let _charData       = null;
    let _nameDisplayMode = 'registered'; // 'registered'(등록명) | 'owner'(소유주명) — 캐릭터 상세 메인 이름 탭
    let _transferToNick = null;
    let _profileTosMap  = {}; // user_id -> user_profiles.tos (제작자 개인공지/TOS 재사용)

    // 성장 Step 이미지 상태 — 상세페이지 메인 이미지는 항상 image_url(워터마크 적용, 크롭 안 됨) 사용.
    // thumbnail_url은 카드/목록 전용이라 상세페이지에서는 아예 조회하지 않는다.
    // 대표 이미지(characters 기존 이미지)는 species.main_image_step_id로 지정된 Step에서 사용하며,
    // 이 Step은 항상 step_order 1이 아닐 수 있다(성장 순서와 대표 이미지 지정이 분리됨).
    let _stepImageMap      = {}; // step_order -> { speciesStepId, imageUrl, label } — 대표 이미지 Step 제외
    let _mainStepOrder     = 1;  // 대표 이미지(characters 기존 이미지)를 사용하는 step_order
    let _mainStepLabel     = 'Step 1';
    let _currentStep       = 1;
    let _stepOriginalCache = {}; // step_order -> original_image_url (온디맨드 캐시)
    let _stepWmUrl         = null;

    // 캐릭터 고유 갤러리 상태 — character_id에 귀속(소유권 이전과 무관하게 유지)
    let _galleryItems       = [];   // character_gallery rows (최신순)
    let _galleryExpanded    = false;
    let _canManageGallery   = false; // 개체 소유주 / 종족주 / admin,staff
    let _siteUserData       = [];   // get_all_users 결과 (디자이너 검색용)
    let _currentUser        = null;
    let _galleryFile        = null;
    let _galleryDesigners   = [];   // { type:'site', userId, nickname } | { type:'external', name, contact }
    let _galleryLightboxIdx = null;

    // 디자이너 표시 HTML 생성
    // 연구소 디자이너: designer_user_ids(uuid)로만 식별해 현재 닉네임을 실시간으로 링크 표시
    // 외부 디자이너: designer_external(jsonb 배열) 항목을 그대로 표시 (이름 안의 "/" 포함, split 없음)
    function renderDesignerList(c) {
      const siteItems = (c.designer_user_ids || []).map(uid => ({
        uid, name: _idToNick[uid] || '(알수없음)'
      }));
      // designer_external은 공개 뷰(characters_public)에서 contact 키가 제거된 채로
      // 내려오므로(이름만 존재) 여기서는 이름 크레딧만 표시한다 — 연락처는 본인/관리자
      // 편집 화면(get_character_for_edit RPC)에서만 확인할 수 있다.
      let externalItems = [];
      if (Array.isArray(c.designer_external) && c.designer_external.length) {
        externalItems = c.designer_external
          .filter(e => e && e.name)
          .map(e => ({ name: e.name }));
      } else if (!siteItems.length && c.designer_nickname) {
        // 완전 레거시(uuid 없음) 단일 텍스트: 현재 연구소 닉네임과 일치하면 site로, 아니면 external 1개로
        const uuid = _nickToId[c.designer_nickname];
        if (uuid) {
          siteItems.push({ uid: uuid, name: c.designer_nickname });
        } else {
          externalItems = [{ name: c.designer_nickname }];
        }
      } else if (siteItems.length && c.designer_nickname) {
        // 부분 레거시(uuid는 있지만 designer_external 데이터가 없음): 임의 분리 없이 leftover 1개만 추출
        const leftover = extractLegacyDesignerLeftover(c.designer_nickname, siteItems.map(s => s.name));
        if (leftover) externalItems = [{ name: leftover }];
      }

      const siteHtml = siteItems.map(item =>
        `<a href="profile.html?user=${item.uid}" style="color:inherit;text-decoration:none;">${item.name}</a>`
      );
      const externalHtml = externalItems.map(item =>
        `<span style="display:inline-block;font-size:10px;font-weight:600;color:#555;background:#e8e8e8;border-radius:4px;padding:1px 5px;margin-right:3px;vertical-align:middle;line-height:1.6;">Site-OFF</span>${item.name}`
      );
      const all = [...siteHtml, ...externalHtml];
      return all.length ? all.join(' <span style="color:var(--text-mute);margin:0 1px;">/</span> ') : (c.designer_nickname || '');
    }

    // 아티스트 표시 HTML — 디자이너와 동일 구조(연락처 없음, 레거시 없음).
    // 연구소 회원: artist_user_ids(uuid)로 현재 닉네임을 실시간 링크 표시
    // 외부 인물: artist_external(jsonb 배열) 항목을 그대로 표시
    function renderArtistList(c) {
      const siteItems = (c.artist_user_ids || []).map(uid => ({
        uid, name: _idToNick[uid] || '(알수없음)'
      }));
      const externalItems = (Array.isArray(c.artist_external) ? c.artist_external : [])
        .filter(e => e && e.name)
        .map(e => ({ name: e.name }));

      const siteHtml = siteItems.map(item =>
        `<a href="profile.html?user=${item.uid}" style="color:inherit;text-decoration:none;">${item.name}</a>`
      );
      const externalHtml = externalItems.map(item =>
        `<span style="display:inline-block;font-size:10px;font-weight:600;color:#555;background:#e8e8e8;border-radius:4px;padding:1px 5px;margin-right:3px;vertical-align:middle;line-height:1.6;">Site-OFF</span>${item.name}`
      );
      const all = [...siteHtml, ...externalHtml];
      return all.length ? all.join(' <span style="color:var(--text-mute);margin:0 1px;">/</span> ') : (c.artist_nickname || '');
    }

    // ── 캐릭터 고유 갤러리 ──────────────────────────────────────────
    // character_id에 귀속되므로 소유권이 이전돼도 그대로 유지된다.

    function galleryDesignerDisplay(item) {
      const siteNames = (item.designer_user_ids || []).map(uid => _idToNick[uid] || '(알수없음)');
      const extNames  = (item.designer_external || [])
        .filter(e => e && e.name)
        .map(e => e.name);
      const all = [...siteNames, ...extNames];
      return all.length ? all.join(' / ') : (item.designer_nickname || '-');
    }

    function galleryTileHtml(item, idx) {
      const thumb = item.thumbnail_url || item.image_url;
      return `<button type="button" class="gallery-tile" onclick="openGalleryLightbox(${idx})"><img src="${thumb}" loading="lazy" alt=""></button>`;
    }

    function renderGalleryGridInner() {
      const limit = _galleryExpanded ? _galleryItems.length : Math.min(4, _galleryItems.length);
      let html = '';
      for (let i = 0; i < limit; i++) html += galleryTileHtml(_galleryItems[i], i);
      return html;
    }

    function renderGallerySectionHtml() {
      if (!_galleryItems.length && !_canManageGallery) return '';
      return `
        <div class="char-gallery-section" id="gallerySectionWrap">
          <div class="char-gallery-header">
            <h2 class="char-gallery-title">갤러리</h2>
            ${_canManageGallery ? `<button type="button" class="btn-ghost" onclick="openGalleryAddModal()">+ 갤러리 추가</button>` : ''}
          </div>
          ${_galleryItems.length ? `
          <div id="galleryGrid" class="character-grid">${renderGalleryGridInner()}</div>
          <div id="galleryMoreWrap" style="text-align:center; margin-top:14px; ${_galleryItems.length > 4 ? '' : 'display:none;'}">
            <button type="button" class="btn-ghost" id="galleryMoreBtn" onclick="toggleGalleryExpand()">${_galleryExpanded ? '접기' : '더보기'}</button>
          </div>` : `<p class="gallery-empty">등록된 갤러리가 없어요.</p>`}
        </div>`;
    }

    // LABBER SUBJECT 연구 기록 카드 — get_labber_subject_card RPC 결과(card)만 사용한다.
    //  - compact 가로형. 아트웍 영역은 항상 같은 크기로 렌더: image_url 이 없거나(null) 로드에 실패해도
    //    "아트웍 없음" placeholder 로 대체해 카드 레이아웃이 변하지 않는다.
    //  - 이름: card.individual_name(SUBJECT 개별 이름, 있을 때만) 이 있으면 큰 글씨 + 아래 작은 글씨로 SUBJECT 종류 이름.
    //    없으면 종류 이름만 큰 글씨(작은 글씨 중복 없음). 개별 이름은 RPC 가 내려주는 값만 사용한다(하드코딩 없음).
    //  - progress: { level, exp_in_level, exp_to_next, is_max } — 누적 EXP 가 아니라 "현재 레벨 구간" 진행도.
    //    progress 가 null(소유주가 오프사이트/계정 없음)이면 이름/그림만 표시.
    //  - SUBJECT 없음 / RPC 실패 → card 가 null 로 넘어와 카드 전체를 렌더하지 않는다.
    function labberSubjectImgFallback(img) {
      const wrap = img && img.closest('.labber-subject-img');
      if (!wrap) return;
      wrap.classList.add('is-empty');
      wrap.innerHTML = '<span class="labber-subject-img-empty">아트웍 없음</span>';
    }

    function renderLabberSubjectSectionHtml(card, isSensitive) {
      if (!card || !card.has_subject || !card.subject_name) return '';
      const typeName = String(card.subject_name);
      const indiv    = (typeof card.individual_name === 'string') ? card.individual_name.trim() : '';
      const hasIndiv = !!indiv && indiv !== typeName;
      const title    = escapeHtml(hasIndiv ? indiv : typeName);
      const p        = card.progress || null;

      const hasImg = typeof card.image_url === 'string' && /^https?:\/\//.test(card.image_url);
      const imgHtml = hasImg ? `
        <div class="labber-subject-img">
          <img src="${escapeHtml(card.image_url)}" alt="${escapeHtml(typeName)} 아트웍" loading="lazy"${isSensitive ? ' class="blurred"' : ''}
               onerror="labberSubjectImgFallback(this)">
          ${isSensitive ? `<div class="sensitive-overlay" onclick="revealSensitive(this,event)"><span style="color:#b91c1c;font-size:11px;font-weight:700;text-align:center;line-height:1.5;">민감한 요소<br><span style="font-weight:400;color:#aaa;">누르면 보기</span></span></div>` : ''}
        </div>` : `
        <div class="labber-subject-img is-empty"><span class="labber-subject-img-empty">아트웍 없음</span></div>`;

      let lvHtml = '';
      let expHtml = '';
      if (p && Number.isFinite(Number(p.level))) {
        const level = Number(p.level);
        const inLv  = Number(p.exp_in_level) || 0;
        const toNx  = Number(p.exp_to_next)  || 0;
        const isMax = p.is_max === true;
        const pct   = isMax ? 100 : (toNx > 0 ? Math.max(0, Math.min(100, Math.round(inLv / toNx * 100))) : 0);
        lvHtml  = `<p class="labber-subject-lv">LV.${level}${isMax ? ' · MAX' : ''}</p>`;
        expHtml = `
          ${isMax ? '' : `<p class="labber-subject-exp-text">EXP ${inLv} / ${toNx}</p>`}
          <div class="labber-subject-exp-bar${isMax ? ' is-max' : ''}" role="progressbar" aria-label="${title} 경험치"
               aria-valuemin="0" aria-valuemax="${isMax ? 1 : toNx}" aria-valuenow="${isMax ? 1 : inLv}">
            <div class="labber-subject-exp-fill" style="width:${pct}%"></div>
          </div>`;
      }

      // SUBJECT 제작자 / 연결 종족 — RPC 가 내려주는 값만 사용(연락처는 서버가 아예 내려주지 않는다).
      //  · credits / species 가 null(기존 등록 개체 등 데이터 없음)이면 이 영역은 렌더하지 않는다.
      const creditNames = (arr) => (Array.isArray(arr) ? arr : []).map(x => {
        if (!x) return '';
        if (x.type === 'site' && x.userId) return `<a href="profile.html?user=${encodeURIComponent(x.userId)}">${escapeHtml(x.nickname || '(알 수 없음)')}</a>`;
        return x.name ? escapeHtml(x.name) : '';
      }).filter(Boolean).join(', ');
      const cr = card.credits || null;
      const desHtml = cr ? creditNames(cr.designers) : '';
      const artHtml = cr ? creditNames(cr.artists) : '';
      const sp = (card.species && card.species.id && card.species.name) ? card.species : null;
      // 디자이너/아티스트: 구분자 없이 flex-wrap — 공간이 되면 한 줄, 좁거나 닉네임이 길면 항목 단위로 자연스럽게 줄바꿈.
      //  (하나만 있으면 그 항목만, 둘 다 없으면 이 줄 자체를 렌더하지 않음)
      const spThumb = (sp && card.speciesThumb) ? escapeHtml(card.speciesThumb) : '';
      const creditLines = [
        (desHtml || artHtml)
          ? `<p class="labber-subject-credit labber-subject-credit--people">${[
              desHtml ? `<span class="labber-subject-credit-item"><b>디자이너</b> ${desHtml}</span>` : '',
              artHtml ? `<span class="labber-subject-credit-item"><b>아티스트</b> ${artHtml}</span>` : '',
            ].filter(Boolean).join('')}</p>`
          : '',
        // 연결 종족 카드 — 카드 전체가 종족 페이지 링크. 썸네일은 종족 대표 썸네일(SUBJECT 이미지 아님). 연결 종족이 없으면 렌더하지 않는다.
        sp ? `<a class="labber-subject-species-card" href="species.html?id=${encodeURIComponent(sp.id)}" title="${escapeHtml(sp.name)} 종족 페이지로 이동" aria-label="연결 종족 ${escapeHtml(sp.name)}">
                <span class="labber-subject-species-thumb"${spThumb ? ` style="background-image:url('${spThumb}')"` : ''}></span>
                <span class="labber-subject-species-name">${escapeHtml(sp.name)}</span>
              </a>` : '',
      ].filter(Boolean).join('');
      const creditsHtml = creditLines ? `<div class="labber-subject-credits">${creditLines}</div>` : '';

      return `
        <div class="labber-subject-section" id="labberSubjectSection">
          <h2 class="labber-subject-title">SUBJECT</h2>
          <div class="labber-subject-card">
            ${imgHtml}
            <div class="labber-subject-body">
              <div class="labber-subject-head">
                <p class="labber-subject-name">${title}</p>
                ${lvHtml}
              </div>
              ${hasIndiv ? `<p class="labber-subject-type">${escapeHtml(typeName)}</p>` : ''}
              ${expHtml}
              ${creditsHtml}
            </div>
          </div>
        </div>`;
    }

    function refreshGallerySection() {
      const wrap = document.getElementById('gallerySectionWrap');
      if (wrap) wrap.outerHTML = renderGallerySectionHtml();
    }

    function toggleGalleryExpand() {
      _galleryExpanded = !_galleryExpanded;
      document.getElementById('galleryGrid').innerHTML = renderGalleryGridInner();
      document.getElementById('galleryMoreBtn').textContent = _galleryExpanded ? '접기' : '더보기';
    }

    function openGalleryLightbox(idx) {
      const item = _galleryItems[idx];
      if (!item) return;
      _galleryLightboxIdx = idx;
      document.getElementById('galleryLightboxImg').src = item.image_url;
      document.getElementById('galleryLightboxDesigner').textContent = '디자이너 · ' + galleryDesignerDisplay(item);
      const catEl = document.getElementById('galleryLightboxCategory');
      catEl.textContent   = item.category ? ('분류 · ' + item.category) : '';
      catEl.style.display = item.category ? '' : 'none';
      const descEl = document.getElementById('galleryLightboxDescription');
      descEl.textContent   = item.description || '';
      descEl.style.display = item.description ? '' : 'none';
      const uploaderNick = _idToNick[item.uploaded_by] || '(알수없음)';
      document.getElementById('galleryLightboxUploader').textContent = '올린 사람 · ' + uploaderNick;
      document.getElementById('galleryLightboxDeleteBtn').style.display = _canManageGallery ? '' : 'none';
      document.getElementById('galleryLightbox').style.display = 'flex';
    }

    function closeGalleryLightbox() {
      document.getElementById('galleryLightbox').style.display = 'none';
      _galleryLightboxIdx = null;
    }

    async function deleteCurrentGalleryItem() {
      const idx  = _galleryLightboxIdx;
      const item = idx === null ? null : _galleryItems[idx];
      if (!item) return;
      if (!confirm('이 갤러리 이미지를 삭제할까요? 되돌릴 수 없어요.')) return;

      const btn = document.getElementById('galleryLightboxDeleteBtn');
      btn.disabled = true;
      btn.textContent = '삭제 중...';

      const { error } = await sb.from('character_gallery').delete().eq('id', item.id);
      if (error) {
        alert('삭제에 실패했어요: ' + error.message);
        btn.disabled = false;
        btn.textContent = '삭제';
        return;

    async function submitGalleryAdd() {
      const errorEl = document.getElementById('galleryAddError');
      errorEl.textContent = '';
      if (!_galleryFile) { errorEl.textContent = '이미지를 선택해주세요.'; return; }
      if (!_galleryDesigners.length) { errorEl.textContent = '디자이너를 1명 이상 추가해주세요.'; return; }

      const btn = document.getElementById('galleryAddConfirmBtn');
      btn.textContent = '등록 중...';
      btn.disabled = true;

      const uploadedPaths = [];
      try {
        const file  = _galleryFile;
        const blob  = await compressImage(file);
        const isGif = blob.type === 'image/gif';
        const ext   = isGif ? 'gif' : 'jpg';
        const ts    = Date.now();
        const rnd   = Math.random().toString(36).slice(2, 8);
        const base  = `character-gallery/${charId}/${ts}_${rnd}`;

        const mainPath = `${base}.${ext}`;
        const { error: mainErr } = await sb.storage.from('images').upload(mainPath, blob, { contentType: blob.type });
        if (mainErr) throw new Error('이미지 업로드에 실패했어요: ' + mainErr.message);
        uploadedPaths.push(mainPath);
        const image_url = sb.storage.from('images').getPublicUrl(mainPath).data.publicUrl;

        let thumbnail_url = null;
        if (!isGif) {
          const thumbBlob = await autoCenterCropToBlob(file, 1, 400, 0.82);
          const thumbPath = `${base}_thumb.jpg`;
          const { error: thumbErr } = await sb.storage.from('images').upload(thumbPath, thumbBlob, { contentType: 'image/jpeg' });
          if (thumbErr) throw new Error('썸네일 업로드에 실패했어요: ' + thumbErr.message);
          uploadedPaths.push(thumbPath);
          thumbnail_url = sb.storage.from('images').getPublicUrl(thumbPath).data.publicUrl;
        }

        const designer_user_ids = _galleryDesigners.filter(d => d.type === 'site').map(d => d.userId);
        const designer_external = _galleryDesigners.filter(d => d.type === 'external').map(d => ({ name: d.name, contact: d.contact || '' }));
        const designer_nickname = _galleryDesigners.map(d => d.type === 'site' ? d.nickname : d.name).join(' / ');
        const category    = document.getElementById('galleryCategory').value.trim() || null;
        const description = document.getElementById('galleryDescription').value.trim() || null;

        const { data: inserted, error: insErr } = await sb.from('character_gallery').insert({
          character_id: charId,
          uploaded_by:  _currentUser.id,
          designer_user_ids,
          designer_external,
          designer_nickname,
          category,
          description,
          image_url,
          thumbnail_url,
        }).select().single();
        if (insErr) throw new Error('갤러리 등록에 실패했어요: ' + insErr.message);

        _galleryItems.unshift(inserted);
        closeGalleryAddModal();
        refreshGallerySection();
      } catch (err) {
        if (uploadedPaths.length) await sb.storage.from('images').remove(uploadedPaths).catch(() => {});
        errorEl.textContent = err.message || '갤러리 등록에 실패했어요.';

        btn.textContent = '등록';
        btn.disabled = false;
      }
    }

    // 카드 목록 모듈)에 저장된 정렬 기준을 그대로 재사용해 목록에 보이는 순서와 동일하게 맞춘다.
    // LABBER처럼 전체 개체리스트(character-list.html)에는 노출되지 않는 종족도
    // species_name 필터만으로 그대로 동작한다(characters 테이블은 species_id가 아니라
    // species_name으로 종족과 연결되는 구조).
    async function loadCharNav(speciesName, currentId) {
      const prevBtn = document.getElementById('charNavPrevBtn');
      const nextBtn = document.getElementById('charNavNextBtn');
      if (!prevBtn || !nextBtn) return;

      const disable = (btn) => { btn.disabled = true; btn.onclick = null; };

      if (!speciesName || speciesName === '(알 수 없음)' || !window.SpeciesCharList) {
        disable(prevBtn); disable(nextBtn);
        return;
      }

      try {
        const ordered = await SpeciesCharList.getOrderedList(speciesName);
        const idx = ordered.findIndex(x => String(x.id) === String(currentId));
        if (idx === -1) { disable(prevBtn); disable(nextBtn); return; }

        const prev = idx > 0 ? ordered[idx - 1] : null;
        const next = idx < ordered.length - 1 ? ordered[idx + 1] : null;

        if (prev) {
          prevBtn.disabled = false;
          prevBtn.onclick = () => { window.location.href = `character.html?id=${prev.id}`; };
        } else {
          disable(prevBtn);
        }

        if (next) {
          nextBtn.disabled = false;
          nextBtn.onclick = () => { window.location.href = `character.html?id=${next.id}`; };
        } else {
          disable(nextBtn);
        }
      } catch (e) {
        console.warn('[character.html] 이전/다음 개체 조회 실패:', e);
        disable(prevBtn); disable(nextBtn);
      }
    }

    }

    async function loadCharacter() {
      const user = await getUser();
      const userNickname = user?.user_metadata?.display_name || user?.user_metadata?.nickname || null;
      const isAdminUser  = isAdminOrStaff(user?.user_metadata?.role);

      // original_image_url 제외 — 권한자가 토글 시 on-demand 조회
      // owner_contact/designer_contact는 연락처라 공개 뷰(characters_public)에 없음 —
      // 본인/관리자가 연락처를 포함해 봐야 하는 편집 화면은 get_character_for_edit() RPC를 쓴다.
      const CHAR_SELECT = 'id,name,owner_custom_name,species_name,image_url,thumbnail_url,default_image_index,additional_images,owner_nickname,owner_user_id,owner_is_offsite,designer_nickname,designer_user_ids,designer_external,char_number,description,owner_description,is_sensitive,sensitive_note,char_sections,custom_field_values,char_categories,allow_free_adoption,allow_resale,allow_paid_adoption,allow_other_adoption,pending_transfer,created_at,representative_step_id,special_badge,artist_user_ids,artist_external,artist_nickname';
      const GALLERY_SELECT = 'id,character_id,uploaded_by,designer_user_ids,designer_external,designer_nickname,category,description,image_url,thumbnail_url,created_at';
      // user_settings.character_name_display_mode — MY 캐릭터 설정과 같은 공용 헬퍼(js/utils.js)로 조회.
      // 상세 페이지 "초기" 표시 이름을 정하는 용도로만 쓰고, 여기서 탭을 눌러도 이 설정 자체는 저장하지 않는다.
      // 나머지 3개 쿼리와 병렬로 한 번만 조회해 중복 조회/깜빡임을 방지한다.
      const [{ data: c, error }, { data: siteUserData }, { data: galleryRows }, nameSettings] = await Promise.all([
        sb.from('characters_public').select(CHAR_SELECT).eq('id', charId).single(),
        sb.rpc('get_all_users'),
        sb.from('character_gallery_public').select(GALLERY_SELECT).eq('character_id', charId).order('created_at', { ascending: false }),
        getUserSettings(user?.id).catch(e => {
          console.warn('[character.html] 이름 표시 설정 조회 실패, 기본값(등록명) 사용:', e);
          return { ...DEFAULT_USER_SETTINGS };
        }),
      ]);

      if (error || !c) {
        // 없는 개체(행 없음)일 때만 noindex — 네트워크 등 일시 오류에는 걸지 않는다.
        if (isSeoRowNotFound(error, c)) applySeoNoIndex();
        document.getElementById('charContent').innerHTML = '<p class="page-loading">개체를 찾을 수 없어요.</p>';
        return;
      }

      loadAdSense();

      const siteNicks = new Set((siteUserData || []).map(u => u.nickname).filter(Boolean));
      _nickToId = Object.fromEntries((siteUserData || []).filter(u => u.nickname && u.id).map(u => [u.nickname, u.id]));
      _idToNick = Object.fromEntries((siteUserData || []).filter(u => u.id && u.nickname).map(u => [u.id, u.nickname]));
      _siteNicks = siteNicks;
      _charData  = c;
      // 초기 활성 탭: 설정이 'owner'이고 owner_custom_name이 실제로 있을 때만 소유주명으로 시작, 그 외에는 전부 등록명
      const _hasOwnerName = !!(c.owner_custom_name && c.owner_custom_name.trim());
      _nameDisplayMode = (nameSettings?.character_name_display_mode === 'owner' && _hasOwnerName) ? 'owner' : 'registered';
      _siteUserData = siteUserData || [];
      _currentUser  = user;
      _galleryItems = galleryRows || [];

      // 제작자(디자이너/아티스트) 개인공지(TOS) — 프로필의 "개인공지"(user_profiles.tos)를 그대로 재사용.
      // user_profiles는 공개 SELECT라 anon도 읽을 수 있고, tos 외 다른 컬럼은 가져오지 않는다.
      // 연구소 회원(user_id)만 대상. 외부 디자이너/아티스트(designer_external/artist_external)는 계정이 없어 제외.
      _profileTosMap = {};
      const _creatorIds = [...new Set([...(c.designer_user_ids || []), ...(c.artist_user_ids || [])])];
      if (_creatorIds.length) {
        const { data: tosRows } = await sb.from('user_profiles').select('user_id, tos').in('user_id', _creatorIds);
        (tosRows || []).forEach(r => { if (r.tos) _profileTosMap[r.user_id] = r.tos; });
      }

      document.title = `${c.name} — 종족연구소`;

      // SEO 메타 — 실제 조회된 개체 데이터 기준. 개체 설명이 없으면 종족명 등 실제 공개 정보로만 fallback.
      // 민감 표시(is_sensitive) 개체의 실제 이미지는 화면에서도 블러 처리되므로 og:image 로 쓰지 않는다.
      const seoCharImg = (!c.is_sensitive && !c.default_image_index && /^https?:\/\//.test(c.image_url || '')) ? c.image_url : null;
      applySeoMeta({
        title: `${c.name} — 종족연구소`,
        description: seoPlainText(c.description)
          || (c.species_name
                ? `종족연구소에 등록된 ${c.species_name} 종족의 개체 ${c.name}입니다.`
                : `종족연구소에 등록된 개체 ${c.name}입니다.`),
        canonicalPath: `/pages/character.html?id=${encodeURIComponent(c.id)}`,
        image: seoCharImg,
      });

      const userId  = user?.id || null;
      const isOwner = !!(userId && c.owner_user_id && userId === c.owner_user_id);

      // 종족 페이지 링크용 species id 조회 + 종족주 판별
      let speciesHref = 'species-list.html';
      let isSpeciesOwner = false;
      let sp = null;
      console.log('[DEBUG] userId:', userId);
      console.log('[DEBUG] c.owner_is_offsite:', c.owner_is_offsite, '| type:', typeof c.owner_is_offsite);
      console.log('[DEBUG] c.owner_user_id:', c.owner_user_id);
      console.log('[DEBUG] c.species_name:', c.species_name);
      if (c.species_name && c.species_name !== '(알 수 없음)') {
        const { data: spData } = await sb.from('species').select('id, owner_nickname, owner_user_id, allow_free_adoption, allow_resale, allow_paid_adoption, allow_other_adoption, custom_fields, main_image_step_id').eq('name', c.species_name).single();
        sp = spData;
        console.log('[DEBUG] sp:', sp);
        if (sp) {
          speciesHref = `species.html?id=${sp.id}`;
          isSpeciesOwner = !!(userId && sp.owner_user_id && userId === sp.owner_user_id);
        }
      }

      // LABBER 개체 — 일반 종족 상세 대신 개체기록실을 기준으로 하고, 페이지 전체에
      // 기존 LABBER 테마(body.labber-theme, _labber.scss)를 적용한다. 새 테마를 만들지 않고
      // 수상한 연구실/LABBER 관리소와 동일한 CSS 변수 리스킨을 그대로 재사용한다.
      const isLabberChar = (typeof LABBER_SPECIES_ID !== 'undefined') && sp?.id === LABBER_SPECIES_ID;
      let speciesCrumbLabel = c.species_name;
      if (isLabberChar) {
        document.body.classList.add('labber-theme', 'labber-individual-detail');
        speciesHref = 'labber-records.html';
        speciesCrumbLabel = '개체기록실';
      }

      // LABBER SUBJECT 카드 데이터 — 반드시 get_labber_subject_card RPC 결과만 사용한다(테이블 직접 조회/조합 금지).
      // 비로그인도 조회 가능. 실패/SUBJECT 없음이면 null → 카드 자체를 숨기고 에러 문구는 노출하지 않는다.
      let labberSubjectCard = null;
      if (isLabberChar) {
        try {
          const { data: cardData, error: cardErr } = await sb.rpc('get_labber_subject_card', { p_character_id: c.id });
          if (!cardErr && cardData && cardData.success === true && cardData.has_subject === true) labberSubjectCard = cardData;
          else if (cardErr) console.warn('[LABBER SUBJECT] 카드 조회 실패:', cardErr.message);

          // 연결 종족 카드용 썸네일 — 종족 목록/카드가 쓰는 기존 소스(species.thumbnail_url → image_url, 연구소 기본 이미지 지정/폴백)를
          // 그대로 재사용한다(utils.js resolveSpeciesImage). SUBJECT 이미지가 아니다. 카드 RPC 는 id/name 만 주므로 표시용으로 1건만 조회.
          // 민감 요소 종족은 실제 이미지를 그대로 노출하지 않고 연구소 기본 이미지를 쓴다. 조회 실패 시에도 기본 이미지로 표시.
          if (labberSubjectCard && labberSubjectCard.species && labberSubjectCard.species.id) {
            const spId = labberSubjectCard.species.id;
            let spRow = { id: spId };
            try {
              const { data: spData } = await sb.from('species')
                .select('id, image_url, thumbnail_url, default_image_index, is_sensitive').eq('id', spId).maybeSingle();
              if (spData) spRow = spData;
            } catch (e) { console.warn('[LABBER SUBJECT] 연결 종족 썸네일 조회 실패:', e); }
            labberSubjectCard.speciesThumb = (spRow.is_sensitive && speciesHasVisibleRealImage(spRow))
              ? speciesDefaultImageUrl(autoDefaultImageIndex(spRow.id))
              : resolveSpeciesImage(spRow);
          }
        } catch (e) {
          console.warn('[LABBER SUBJECT] 카드 조회 예외:', e);
        }
      }

      _canManageGallery = isOwner || isSpeciesOwner || isAdminUser;

      console.log('[DEBUG] isOwner:', isOwner);
      console.log('[DEBUG] isSpeciesOwner:', isSpeciesOwner);
      console.log('[DEBUG] 버튼 표시 조건:', isOwner || (isSpeciesOwner && c.owner_is_offsite));
      let categoryBadgeHtml = '';
      const specialBadge = c.special_badge ? SPECIAL_BADGE_MAP[c.special_badge] : null;
      const specialBadgeHtml = specialBadge
        ? `<span class="special-classification-badge ${specialBadge.className}">${specialBadge.label}</span>`
        : '';
      if (specialBadgeHtml || c.char_categories?.length) {
        const badges = (c.char_categories || []).map(cat => {
          const r = parseInt(cat.color.slice(1,3),16), g = parseInt(cat.color.slice(3,5),16), b = parseInt(cat.color.slice(5,7),16);
          const tc = (0.299*r+0.587*g+0.114*b)/255 > 0.5 ? '#000' : '#fff';
          return `<span style="display:inline-block; padding:3px 12px; border-radius:20px; background:${cat.color}; color:${tc}; font-size:12px; font-weight:600;">${cat.label}</span>`;
        }).join('');
        categoryBadgeHtml = `<div class="classification-badges">${specialBadgeHtml}${badges}</div>`;
      }
      afterDeleteHref = speciesHref;

      // 관계 섹션에 사용할 상대 캐릭터 정보 미리 로드 (복수 관계 섹션 대응)
      let relationCharsMap = {};
      const allRelIds = (c.char_sections || [])
        .filter(s => s.type === 'relation')
        .flatMap(s => (s.relations || []).map(r => r.char_id))
        .filter(Boolean);
      if (allRelIds.length) {
        const { data: relChars } = await sb.from('characters').select('id, name, image_url, thumbnail_url, default_image_index, species_name').in('id', allRelIds);
        (relChars || []).forEach(rc => { relationCharsMap[rc.id] = rc; });
      }

      const isMainGif        = /\.gif(\?|$)/i.test(c.image_url || '');
      const showingRealMain  = characterHasVisibleRealImage(c, { thumb: false }); // 연구소 기본 이미지로 대체 중이면 원본/워터마크 토글이 의미 없음
      const canViewOriginal  = !isMainGif && showingRealMain && (isOwner || isSpeciesOwner); // GIF는 워터마크 없으므로 토글 미표시
      const autoShowOriginal = !isMainGif && showingRealMain && (isOwner || isSpeciesOwner);

      // 성장 Step 이미지 — 대표 이미지 Step은 characters 기존 이미지를 그대로 쓰고,
      // 나머지 Step 중 실제로 image_url이 등록된 것만 버튼으로 표시.
      // 여기서는 URL 등 메타데이터만 조회하며, 실제 이미지 바이트는 버튼 클릭 시(image_url을 img.src에 대입할 때)에만 요청된다.
      _stepImageMap  = {};
      _mainStepOrder = 1;
      _mainStepLabel = 'Step 1';
      let hasStepSystem = false; // 이 종족이 성장 Step 기능을 쓰는지 — Step이 1개(대표만)여도 칩은 항상 보여준다.
      if (sp?.id) {
        const { data: steps } = await sb.from('species_steps').select('id, step_order, name').eq('species_id', sp.id).order('step_order');
        const allSteps = steps || [];
        if (allSteps.length >= 2) {
          hasStepSystem = true;
          // 개체별 대표 Step(c.representative_step_id) 우선 — 우선순위가 설정된 종족(현재 융용)만 채워짐.
          // 하위 호환: 둘 다 없으면 step_order가 가장 낮은 Step을 대표 이미지 Step으로 처리
          const mainStepId = c.representative_step_id || sp.main_image_step_id || allSteps[0].id;
          const mainStep   = allSteps.find(s => s.id === mainStepId) || allSteps[0];
          _mainStepOrder = mainStep.step_order;
          _mainStepLabel = mainStep.name || `Step ${mainStep.step_order}`;

          const otherSteps = allSteps.filter(s => s.id !== mainStep.id);
          if (otherSteps.length) {
            const { data: stepImgs } = await sb.from('character_step_images')
              .select('species_step_id, image_url')
              .eq('character_id', charId)
              .in('species_step_id', otherSteps.map(s => s.id));
            const imgByStepId = {};
            (stepImgs || []).forEach(row => { imgByStepId[row.species_step_id] = row; });
            otherSteps.forEach(s => {
              const row = imgByStepId[s.id];
              if (row?.image_url) {
                _stepImageMap[s.step_order] = {
                  speciesStepId: s.id,
                  imageUrl:      row.image_url,
                  label:         s.name || `Step ${s.step_order}`,
                };
              }
            });
          }
        }
      }
      _currentStep = _mainStepOrder;
      const hasStepButtons = hasStepSystem;

      const registeredDate = new Date(c.created_at).toLocaleDateString('ko-KR', {
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).replace(/\. /g, '.').replace(/\.$/, '');

      const additionalImgs = (c.additional_images || []).map((url, idx) => `
        <div style="width:100%; border-radius:var(--radius); overflow:hidden; margin-top:10px; ${c.is_sensitive ? 'position:relative;' : ''}">
          <img src="${url}" data-extra-idx="${idx}" class="${c.is_sensitive ? 'blurred' : ''}" style="width:100%; display:block; object-fit:cover;">
          ${c.is_sensitive ? `<div class="sensitive-overlay" onclick="revealSensitive(this,event)"><div style="display:flex;flex-direction:column;align-items:center;gap:5px;"><svg width="28" height="26" viewBox="0 0 28 26" fill="none"><path d="M14 2L26 24H2L14 2Z" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="14" y1="9" x2="14" y2="16" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="20" r="1.2" fill="#b91c1c"/></svg><span style="color:#b91c1c;font-size:16px;font-weight:700;">민감한 요소</span>${c.sensitive_note ? '<span class="sensitive-overlay-note">' + c.sensitive_note + '</span>' : ''}<span class="sensitive-overlay-hint">누르면 이미지가 보여요</span></div></div>` : ''}
        </div>
      `).join('');

      const adoptionRulesHtml = [
        { label: '재분양',    charVal: c.allow_resale,         spVal: sp?.allow_resale         },
        { label: '무료분양',  charVal: c.allow_free_adoption,  spVal: sp?.allow_free_adoption  },
        { label: '유료/경매', charVal: c.allow_paid_adoption,  spVal: sp?.allow_paid_adoption  },
        { label: '기타분양',  charVal: c.allow_other_adoption, spVal: sp?.allow_other_adoption },
      ].map(({ label, charVal, spVal }) => {
        const isCharSet = charVal !== null && charVal !== undefined;
        const finalVal  = isCharSet ? charVal : (spVal ?? true);
        const source    = isCharSet ? '개체 개별 설정' : '종족 설정';
        const color     = finalVal ? 'var(--sky-deep)' : '#ef4444';
        return `<div class="char-info-row">
          <span class="char-info-label">${label}</span>
          <span class="char-info-value"><span style="font-weight:600; color:${color};">${finalVal ? '가능' : '불가능'}</span><span style="font-size:11px; color:var(--text-mute); margin-left:4px;">(${source})</span></span>
        </div>`;
      }).join('');

      const ownerDisplayNick = (!c.owner_is_offsite && c.owner_user_id && _idToNick[c.owner_user_id])
        ? _idToNick[c.owner_user_id] : c.owner_nickname;

      const hasOwnerCustomName = !!(c.owner_custom_name && c.owner_custom_name.trim());
      if (!hasOwnerCustomName) _nameDisplayMode = 'registered';
      const displayedCharName = (hasOwnerCustomName && _nameDisplayMode === 'owner') ? c.owner_custom_name : c.name;

      document.getElementById('charContent').innerHTML = `
        <div class="char-page-header">
          <div class="breadcrumb">
            ${(c.species_name && c.species_name !== '(알 수 없음)') ? `<a href="${speciesHref}">${speciesCrumbLabel}</a><span>/</span>` : ''}
            <span>${c.name}</span>
          </div>
          ${hasOwnerCustomName ? `
          <div class="char-name-tabs" role="tablist" aria-label="이름 전환">
            <button type="button" class="char-name-tab ${_nameDisplayMode === 'registered' ? 'active' : ''}" data-mode="registered" onclick="setCharNameMode('registered')">등록명</button>
            <button type="button" class="char-name-tab ${_nameDisplayMode === 'owner' ? 'active' : ''}" data-mode="owner" onclick="setCharNameMode('owner')">소유주명</button>
          </div>` : ''}
          <div class="char-page-name-row">
            <h1 class="char-page-name" id="charPageName">${displayedCharName}</h1>
            <button type="button" id="charBookmarkBtn" class="bookmark-toggle-btn">☆ 북마크</button>
            <div class="char-nav-buttons" id="charNavButtons">
              <button type="button" class="char-nav-btn" id="charNavPrevBtn" disabled aria-label="이전 개체" title="이전 개체">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button type="button" class="char-nav-btn" id="charNavNextBtn" disabled aria-label="다음 개체" title="다음 개체">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="char-body">
          <div class="char-img-wrap">
            ${hasStepButtons ? `
            <div id="stepButtonRow" style="display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 14px; max-width:100%;">
              ${[_mainStepOrder, ...Object.keys(_stepImageMap).map(Number)].sort((a,b) => a-b).map(order => {
                const isMain = order === _mainStepOrder;
                const label  = isMain ? _mainStepLabel : _stepImageMap[order].label;
                return `<button type="button" class="step-btn ${isMain ? 'active' : ''}" data-step-order="${order}" onclick="selectCharStep(${order})">${label}</button>`;
              }).join('')}
            </div>` : ''}
            <div class="char-img-area">
              ${characterHasVisibleRealImage(c, { thumb: false })
                ? (c.is_sensitive
                    ? `<div style="position:relative; overflow:hidden; border-radius:var(--radius); max-width:100%;"><img id="charMainImg" src="${c.image_url}" alt="${c.name}" class="blurred" style="max-width:100%; max-height:100%; width:auto; height:auto; display:block;"><div class="sensitive-overlay" onclick="revealSensitive(this,event)"><div style="display:flex;flex-direction:column;align-items:center;gap:5px;"><svg width="28" height="26" viewBox="0 0 28 26" fill="none"><path d="M14 2L26 24H2L14 2Z" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="14" y1="9" x2="14" y2="16" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="20" r="1.2" fill="#b91c1c"/></svg><span style="color:#b91c1c;font-size:16px;font-weight:700;">민감한 요소</span>${c.sensitive_note ? '<span class="sensitive-overlay-note">' + c.sensitive_note + '</span>' : ''}<span class="sensitive-overlay-hint">누르면 이미지가 보여요</span></div></div></div>`
                    : `<img id="charMainImg" src="${c.image_url}" alt="${c.name}" style="max-width:100%; max-height:100%; width:auto; height:auto; display:block;">`)
                : `<img id="charMainImg" src="${resolveCharacterImage(c, { thumb: false })}" alt="${c.name}" style="max-width:100%; max-height:100%; width:auto; height:auto; display:block;">`}
            </div>
            ${canViewOriginal ? `
            <div style="margin-top:8px; text-align:center; font-size:12px; color:var(--text-mute);">
              <span id="imgStateLabel">${autoShowOriginal ? '불러오는 중...' : '워터마크 이미지를 보고 있습니다.'}</span>
              <button id="imgToggleBtn" onclick="toggleOriginalImage()" style="margin-left:6px; background:none; border:none; color:var(--sky-deep); font-size:12px; cursor:pointer; text-decoration:underline; font-family:inherit; padding:0;">${autoShowOriginal ? '' : '원본 이미지 보기'}</button>
            </div>` : ''}
            ${additionalImgs}
          </div>

          <aside class="char-info-panel">
            ${c.pending_transfer ? `
            <div style="padding:10px 14px; background:#fffbeb; border:1px solid #fde68a; border-radius:10px; margin-bottom:12px; font-size:13px; color:#92400e; font-weight:500;">
              이전 확인 중 · <strong>${c.pending_transfer.to}</strong>님에게
            </div>` : ''}
            ${categoryBadgeHtml}
            ${c.species_name === '(알 수 없음)' ? `
            <div class="char-info-row">
              <span class="char-info-label">종족</span>
              <span class="char-info-value" style="color:var(--text-mute);">(알 수 없음)</span>
            </div>` : (c.species_name ? `
            <div class="char-info-row">
              <span class="char-info-label">종족</span>
              <a href="${speciesHref}" class="char-info-value char-info-link">${c.species_name}</a>
            </div>` : '')}
            ${c.char_number ? `
            <div class="char-info-row">
              <span class="char-info-label">개체번호</span>
              <span class="char-info-value">${c.char_number}</span>
            </div>` : ''}
            ${c.designer_nickname ? `
            <div class="char-info-row">
              <span class="char-info-label">디자이너</span>
              <span class="char-info-value">${renderDesignerList(c)}</span>
            </div>` : ''}
            ${(c.artist_nickname || (c.artist_user_ids && c.artist_user_ids.length) || (Array.isArray(c.artist_external) && c.artist_external.length)) ? `
            <div class="char-info-row">
              <span class="char-info-label">아티스트</span>
              <span class="char-info-value">${renderArtistList(c)}</span>
            </div>` : ''}
            <div class="char-info-row">
              <span class="char-info-label">소유주</span>
              <span class="char-info-value">${c.owner_nickname
                ? (c.owner_is_offsite
                    ? `${isSpeciesOwner ? `<button onclick="openTransferModal()" style="flex-shrink:0;font-size:12px;font-weight:700;color:var(--sky-deep);background:var(--sky-light);border:1px solid var(--sky);border-radius:6px;padding:5px 14px;cursor:pointer;font-family:inherit;margin-right:6px;vertical-align:middle;">소유권 이전</button>` : ''}<span style="display:inline-block;font-size:10px;font-weight:600;color:#555;background:#e8e8e8;border-radius:4px;padding:1px 5px;margin-right:5px;vertical-align:middle;line-height:1.6;">Site-OFF</span>${c.owner_nickname}`
                    : (c.owner_user_id
                        ? `<a href="profile.html?user=${c.owner_user_id}" style="color:inherit;text-decoration:none;">${ownerDisplayNick}</a>`
                        : `${ownerDisplayNick}`))
                : '—'
              }</span>
            </div>
            <div class="char-info-row">
              <span class="char-info-label">등록일</span>
              <span class="char-info-value">${registeredDate}</span>
            </div>

            <div class="char-info-divider"></div>
            <p class="char-info-label" style="margin-bottom:6px; font-weight:700;">📜 분양 규칙</p>
            ${adoptionRulesHtml}

            ${c.description ? `
            <div class="char-info-divider"></div>
            <p class="char-info-desc">${c.description}</p>` : ''}

            ${c.owner_description ? `
            <div class="char-info-divider"></div>
            <p class="char-info-desc">${c.owner_description}</p>` : ''}

            ${(() => {
              if (!c.custom_field_values) return '';
              const validKeys = Array.isArray(sp?.custom_fields) && sp.custom_fields.length
                ? sp.custom_fields
                : Object.keys(c.custom_field_values);
              const hasVal = (v) => Array.isArray(v) ? v.length > 0 : !!v;

              // LABBER 개체: POD / CARTRIDGE / INK / SUBJECT 는 trait code 배열(또는 레거시 문자열)
              //  → 특성별 한 줄(특성명 + 등급 badge), 값 영역 오른쪽 정렬, 특성명은 관리소 딥링크.
              //  (INK 는 복수 — 여러 색상이 한 줄씩 쌓인다. 레거시 자유입력 문자열은 매칭 실패 시 원문 노출)
              // 그 외 커스텀 필드는 기존대로 값 문자열 그대로 표시(오른쪽 정렬은 .char-info-value 기본).
              const LABBER_TRAIT_FIELD_TYPE = { pod: 'pod', cartridge: 'cartridge', ink: 'ink', subject: 'subject' };
              const labberTraitType = (k) => {
                if (!isLabberChar || typeof labberTraitsByType !== 'function') return null;
                return LABBER_TRAIT_FIELD_TYPE[String(k).trim().toLowerCase()] || null;
              };
              const renderLabberTraitRow = (k, type) => {
                const codes = labberTraitCodesFromValue(type, c.custom_field_values[k]);
                if (!codes.length) return null;
                const lines = codes.map(code => {
                  const t = labberTraitByCode(code);
                  if (!t) return '';
                  return `<span class="labber-trait-line">
                    <a class="labber-trait-line-name" href="${labberTraitDeepLink(code)}">${t.name}</a>
                    ${labberTraitGradeBadgeHtml(t.grade)}
                  </span>`;
                }).join('');
                return `<div class="char-info-row">
                  <span class="char-info-label">${k}</span>
                  <span class="char-info-value labber-trait-lines labber-trait-lines--${type}">${lines}</span>
                </div>`;
              };

              const rows = validKeys
                .filter(k => hasVal(c.custom_field_values[k]))
                .map(k => {
                  const ltt = labberTraitType(k);
                  if (ltt) {
                    const html = renderLabberTraitRow(k, ltt);
                    if (html) return html;
                  }
                  return `
                  <div class="char-info-row">
                    <span class="char-info-label">${k}</span>
                    <span class="char-info-value">${c.custom_field_values[k]}</span>
                  </div>`;
                }).join('');
              return rows ? `<div class="char-info-divider"></div>${rows}` : '';
            })()}

            ${(() => {
              // SUBJECT 육성 카드(개별 SUBJECT 기록) — 위 정보 목록의 SUBJECT 특성 행(디자인 정보)과는 별개로 함께 표시.
              // LABBER 개체이고 SUBJECT 가 있을 때만(labberSubjectCard 가 null 이면 빈 문자열 → 구분선도 없음).
              const subjectCardHtml = renderLabberSubjectSectionHtml(labberSubjectCard, !!c.is_sensitive);
              return subjectCardHtml ? `<div class="char-info-divider"></div>${subjectCardHtml}` : '';
            })()}

            ${isOwner || isSpeciesOwner ? `
            <div class="char-info-divider"></div>
            <div style="display:flex; justify-content:${isOwner ? 'space-between' : 'flex-end'}; align-items:center;">
              ${isOwner ? `<button onclick="deleteCharacter()" style="padding:8px 16px; border:1px solid #fca5a5; border-radius:8px; background:#fff; color:#ef4444; font-size:13px; cursor:pointer; font-family:inherit;">개체 삭제</button>` : ''}
              <div style="display:flex; gap:8px;">
                ${isOwner ? (c.pending_transfer
                  ? `<button onclick="cancelPendingTransfer()" style="padding:6px 14px; border:1px solid #fde68a; border-radius:8px; background:#fffbeb; color:#92400e; font-size:13px; cursor:pointer;">이전 취소</button>`
                  : `<a href="character-transfer.html?id=${charId}" class="btn-ghost">개체 이전</a>`)
                  : ''}
                ${isSpeciesOwner && c.owner_is_offsite ? `<button onclick="openTransferModal()" class="btn-ghost">소유권 이전</button>` : ''}
                <a href="character-edit.html?id=${charId}" class="btn-ghost">개체 정보 수정</a>
              </div>
            </div>` : ''}
          </aside>
        </div>

        ${renderGallerySectionHtml()}

        ${(() => {
          // 제작자 TOS — 디자이너/아티스트의 "개인공지"(user_profiles.tos)를 개체 상세에서 바로 확인.
          // 연구소 회원만 대상(designer_user_ids / artist_user_ids). 외부(designer_external/artist_external)는 제외.
          const desIds = c.designer_user_ids || [];
          const artIds = c.artist_user_ids || [];
          if (!desIds.length && !artIds.length) return '';

          const personCard = (uid) => {
            const nick = _idToNick[uid] || '(알수없음)';
            const tos  = _profileTosMap[uid];
            const body = (tos && String(tos).replace(/<[^>]*>/g, '').trim())
              ? `<div class="guide-section-text ql-display">${typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(stripUnsafeRenderedImages(tos)) : tos}</div>`
              : `<p class="tos-empty">등록된 개인 공지가 없습니다.</p>`;
            return `<div class="tos-person">
              <a href="profile.html?user=${uid}" class="tos-person-name">${nick}</a>
              ${body}
            </div>`;
          };

          const tabs = [];
          if (desIds.length) tabs.push({ label: '디자이너 TOS', html: desIds.map(personCard).join('') });
          if (artIds.length) tabs.push({ label: '아티스트 TOS', html: artIds.map(personCard).join('') });

          // 기본 접힘: active 탭 없음 + is-collapsed. 탭 클릭 시 해당 패널만 펼침(같은 탭 재클릭=접힘).
          return `
        <div class="char-sections">
          <div class="guide-tabs is-collapsed" id="tosTabs">
            <div class="guide-tab-nav" id="tosTabNav">
              ${tabs.map((t, i) => `<button class="guide-tab-btn" onclick="switchTosTab(${i})">${t.label}</button>`).join('')}
            </div>
            <div class="guide-tab-panels" id="tosTabPanels">
              ${tabs.map((t) => `<div class="guide-tab-panel">${t.html}</div>`).join('')}
            </div>
          </div>
        </div>`;
        })()}

        ${c.char_sections?.length ? `
        <div class="char-sections">
          <div class="guide-tabs">
            <div class="guide-tab-nav" id="charSecNav">
              ${c.char_sections.map((s, i) => `
                <button class="guide-tab-btn${i === 0 ? ' active' : ''}" onclick="switchCharSection(${i})">
                  ${s.type === 'settings' ? '설정' : s.type === 'relation' ? '관계' : (s.title || '직접입력')}
                </button>`).join('')}
            </div>
            <div class="guide-tab-panels" id="charSecPanels">
              ${c.char_sections.map((s, i) => {
                let inner = '';
                if (s.type === 'settings') {
                  inner = `<div class="guide-section-text ql-display">${typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(stripUnsafeRenderedImages(s.content || '')) : (s.content || '')}</div>`;
                } else if (s.type === 'relation') {
                  const makeAvatar = (imgUrl, name) => imgUrl
                    ? `<img src="${imgUrl}" class="relation-avatar" alt="${name}">`
                    : `<div class="relation-avatar-placeholder">${(name||'?')[0]}</div>`;
                  inner = (s.relations || []).length
                    ? s.relations.map(r => {
                        const rc = relationCharsMap[r.char_id] || {};
                        return `
                        <div class="relation-card">
                          <div class="relation-card-duo">
                            <div class="relation-char-side">
                              ${makeAvatar(resolveCharacterImage(c), c.name)}
                              <span class="relation-char-name">${c.name}</span>
                              <span class="relation-char-species">${c.species_name || ''}</span>
                            </div>
                            <div class="relation-center">
                              ${r.relation_label ? `<span class="relation-type-badge">${r.relation_label}</span>` : ''}
                              <span class="relation-arrows">↔</span>
                            </div>
                            <div class="relation-char-side relation-char-side--right">
                              ${makeAvatar(rc.id ? resolveCharacterImage(rc) : null, r.char_name)}
                              <a href="character.html?id=${r.char_id}" class="relation-char-name">${r.char_name}</a>
                              <span class="relation-char-species">${r.species_name || ''}</span>
                            </div>
                          </div>
                          ${r.description ? `<div class="relation-card-desc ql-display">${typeof DOMPurify!=='undefined' ? DOMPurify.sanitize(stripUnsafeRenderedImages(r.description)) : r.description}</div>` : ''}
                        </div>`;
                      }).join('')
                    : '<p style="color:var(--text-mute);font-size:13px;">등록된 관계가 없어요.</p>';
                } else {
                  inner = `<div class="guide-section-text ql-display">${typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(stripUnsafeRenderedImages(s.content || '')) : (s.content || '')}</div>`;
                }
                return `<div class="guide-tab-panel${i === 0 ? ' active' : ''}">${inner}</div>`;
              }).join('')}
            </div>
          </div>
        </div>` : ''}
      `;

      initBookmarkButton('charBookmarkBtn', 'character', Number(charId));

      // 이전/다음 개체 이동 — 본문 렌더와 무관하게 처리(실패해도 상세 화면에는 영향 없음)
      loadCharNav(c.species_name, charId);

      // 본인 소유/종족 개체는 원본 이미지를 기본으로 표시
      if (autoShowOriginal) {
        toggleOriginalImage();
      }

      if (charId === '30') {
        const _v = await window.incrementAchCounter?.('gong_o_visit') || 0;
        // award_achievement RPC가 멱등이라 동시 호출해도 안전하지만,
        // 반복 방문 시 불필요한 동시 요청을 줄이기 위해 순차 실행한다.
        if (_v >= 1)   await window.awardAchievement?.('gong_o_visit_1');
        if (_v >= 5)   await window.awardAchievement?.('gong_o_visit_5');
        if (_v >= 20)  await window.awardAchievement?.('gong_o_visit_20');
        if (_v >= 100) await window.awardAchievement?.('gong_o_visit_100');
      } else {
        // 개체 상세 조회 업적 (고유 조회 기준)
        const _cv = await window.trackCharView?.(parseInt(charId)) || 0;
        if (_cv >= 20)  window.awardAchievement?.('char_view_20');
        if (_cv >= 50)  window.awardAchievement?.('char_view_50');
        if (_cv >= 100) window.awardAchievement?.('char_view_100');
      }
    }
  </script>
</body>
</html>
