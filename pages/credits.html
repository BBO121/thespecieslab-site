  <style>
    .credits-header {
      text-align: center;
      padding-top: 24px;
      margin-bottom: 36px;
    }
    .credits-section { margin-bottom: 40px; }
    .credits-section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-mute);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: center;
    }
    .credits-grid--center {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: center;
    }
    .credits-grid--center .credits-card {
      width: 200px;
    }
    .credits-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.2s;
      text-decoration: none;
      display: block;
    }
    .credits-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
    }
    .credits-card-img {
      width: 100%;
      height: 200px;
      background: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .credits-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .credits-card-img svg {
      width: 32px;
      height: 32px;
      color: var(--sky);
      opacity: 0.4;
    }
    .credits-card-info {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }
    .credits-card-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .credits-card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 5px;
    }
    .credits-card-duties {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 4px;
    }
    .credits-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }
    .credits-badge--director {
      background: #FEF3C7;
      color: #D97706;
    }
    .credits-badge--staff {
      background: #DCFCE7;
      color: #16A34A;
    }
    .credits-badge--role-ops {
      background: #DBEAFE;
      color: #2563EB;
    }
    .credits-badge--role-plan {
      background: #EDE9FE;
      color: #7C3AED;
    }
    .credits-badge--role-dev {
      background: #CFFAFE;
      color: #0891B2;
    }
    .credits-badge--role-design {
      background: #FCE7F3;
      color: #DB2777;
    }
    .credits-thanks {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.8;
      text-align: center;
    }
    @media (max-width: 480px) {
      .credits-grid--center .credits-card { width: calc(50% - 9px); }
    }
  </style>
</head>
