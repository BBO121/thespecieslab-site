<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E8JG7D53T5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-E8JG7D53T5');
  </script>
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>비밀번호 찾기 — 종족연구소</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">종족연구소</a>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">

      <h1 class="auth-title">비밀번호 찾기</h1>
      <p class="auth-subtitle">인증한 실제 이메일 주소를 입력해주세요</p>

      <form class="auth-form" id="forgotForm">

        <div class="form-group">
          <label class="form-label">이메일</label>
          <input type="email" id="email" class="form-input" placeholder="가입 시 인증한 이메일 주소" required>
        </div>

        <p class="form-hint" id="forgotMessage"></p>

        <button type="submit" class="btn-submit" id="forgotBtn">재설정 메일 보내기</button>

      </form>

      <p class="auth-switch">
        <a href="login.html">로그인으로 돌아가기</a>
      </p>

    </div>
  </div>

  <footer class="footer">
    <p class="footer-links"><span>© 2026 종족연구소</span><a href="terms.html">이용약관</a><a href="privacy.html">개인정보처리방침</a><a href="credits.html">운영진</a><a href="mailto:contact@thespecieslab.com">문의</a><a href="https://x.com/thespecieslab" target="_blank" rel="noopener">X</a><span>ver.2.1</span></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email     = document.getElementById('email').value.trim();
      const messageEl = document.getElementById('forgotMessage');
      const btn       = document.getElementById('forgotBtn');

      if (!email) return;

      btn.textContent = '전송 중...';
      btn.disabled = true;
      messageEl.textContent = '';
      messageEl.className = 'form-hint';

      const { error } = await requestPasswordReset(email);

      // error는 "이메일이 존재하는지"가 아니라 요청 자체의 성공/실패만 의미한다
      // (Supabase는 이메일 존재 여부와 무관하게 항상 error: null을 반환하도록
      // 설계돼 있음) — 이 값으로 계정 존재 여부를 추론하는 분기는 만들지 않는다.
      if (error) {
        messageEl.className = 'auth-error';
        messageEl.textContent = '요청을 처리하지 못했어요. 잠시 후 다시 시도해주세요.';
      } else {
        messageEl.className = 'form-hint';
        messageEl.textContent = '입력한 이메일로 가입된 계정이 있다면 비밀번호 재설정 메일을 보내드렸습니다.';
        document.getElementById('email').value = '';
      }

      btn.textContent = '재설정 메일 보내기';
      btn.disabled = false;
    });
  </script>
</body>
</html>
