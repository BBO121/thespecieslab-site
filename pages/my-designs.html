<html lang="ko">
<head>

  <link rel="icon" href="../images/favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>내 디자인 — 종족연구소</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">종족연구소</a>
      <nav class="header-nav">
        <a href="login.html" class="btn-login">로그인</a>
      </nav>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">

      <div id="pageLoading" class="page-loading">불러오는 중...</div>

      <div id="pageContent" style="display:none;">

        <div class="list-page-header">
          <div>
            <h1 class="list-page-title">내 디자인</h1>
            <p class="list-page-count"><span id="charCount">0</span>개의 개체</p>
          </div>
        </div>

        <div class="list-controls">
          <input
            type="text"
            id="filterInput"
            class="list-search"
            placeholder="이름으로 검색..."
            oninput="filterCards()"
          >
          <select class="list-sort" id="speciesFilter" onchange="filterCards()">
            <option value="">전체 종족</option>
          </select>
        </div>

        <div class="character-grid" id="charGrid"></div>
        <div id="paginationWrap"></div>

        <div id="emptyState" class="empty-state-wrap" style="display:none;">
          <div class="empty-state-icon">✏️</div>
          <p class="empty-state-title">등록된 디자인이 없어요</p>
          <p class="empty-state-desc">아직 디자이너로 등록된 개체가 없어요.</p>
        </div>

        <p id="noResult" class="empty-state" style="display:none;">검색 결과가 없어요.</p>

      </div>

    </main>
  </div>

  <footer class="footer">
    <p class="footer-links"><span>© 2026 종족연구소</span><a href="terms.html">이용약관</a><a href="privacy.html">개인정보처리방침</a><a href="credits.html">운영진</a><a href="mailto:contact@thespecieslab.com">문의</a><a href="https://x.com/thespecieslab" target="_blank" rel="noopener">X</a><span>ver.2.1</span></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/bookmark.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/main.js"></script>
  <script>
    let allChars = [];
    const pager = createPager(renderCards);

    async function initPage() {
      const user = await getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const nickname = user.user_metadata?.display_name || user.user_metadata?.nickname || '유저';
      const userId   = user.id;
      const SELECT   = 'id, name, species_name, owner_nickname, image_url, thumbnail_url, default_image_index, created_at, is_sensitive, sensitive_note';

      // UUID 기반 조회(신규) + nickname 기반 조회(레거시) 병행 후 중복 제거
      const [{ data: byUuid }, { data: byNick }] = await Promise.all([
        sb.from('characters').select(SELECT).contains('designer_user_ids', [userId]),
        sb.from('characters').select(SELECT).eq('designer_nickname', nickname),
      ]);
      const seen = new Set();
      const combined = [...(byUuid || []), ...(byNick || [])].filter(c => {
        if (seen.has(c.id)) return false;
        seen.add(c.id);
        return true;
      }).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      document.getElementById('pageLoading').style.display = 'none';
      document.getElementById('pageContent').style.display = 'block';

      if (!combined.length) {
        document.getElementById('emptyState').style.display = 'flex';
        return;
      }

      allChars = combined;
      document.getElementById('charCount').textContent = combined.length;

      const species = [...new Set(combined.map(c => c.species_name).filter(Boolean))];
      const select  = document.getElementById('speciesFilter');
      species.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        select.appendChild(opt);
      });

      pager.load(combined);
    }

    function revealSensitive(overlayEl, e) {
      e.stopPropagation(); e.preventDefault();
      const wrap = overlayEl.parentElement;
      wrap.querySelectorAll('.blurred').forEach(el => el.classList.remove('blurred'));
      overlayEl.remove();
    }

    function renderCards(list) {
      const grid = document.getElementById('charGrid');
      grid.innerHTML = list.map(c => `
        <a href="character.html?id=${c.id}" class="character-card">
          ${c.is_sensitive && characterHasVisibleRealImage(c) ? `
          <div style="position:relative; overflow:hidden; border-radius:var(--radius);">
            <div class="character-img blurred" style="background-image:url('${c.thumbnail_url || c.image_url}');background-size:cover;background-position:center;"></div>
            <div class="sensitive-overlay" onclick="revealSensitive(this,event)"><div style="display:flex;flex-direction:column;align-items:center;gap:5px;"><svg width="28" height="26" viewBox="0 0 28 26" fill="none"><path d="M14 2L26 24H2L14 2Z" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="14" y1="9" x2="14" y2="16" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="20" r="1.2" fill="#b91c1c"/></svg><span style="color:#b91c1c;font-size:16px;font-weight:700;">민감한 요소</span>${c.sensitive_note ? '<span class="sensitive-overlay-note">' + c.sensitive_note + '</span>' : ''}<span class="sensitive-overlay-hint">누르면 이미지가 보여요</span></div></div>
          </div>` : `
          <div class="character-img" style="background-image:url('${resolveCharacterImage(c)}');background-size:cover;background-position:center;"></div>`}
          <div class="character-info">
            <p class="character-name">${c.name}</p>
            <p class="character-species">${c.species_name || ''}</p>
            <p class="character-owner">소유주: ${c.owner_nickname || '—'}</p>
          </div>
        </a>
      `).join('');
    }

    function filterCards() {
      const q       = document.getElementById('filterInput').value.trim().toLowerCase();
      const species = document.getElementById('speciesFilter').value;

      const filtered = allChars.filter(c => {
        const matchName    = !q || c.name.toLowerCase().includes(q);
        const matchSpecies = !species || c.species_name === species;
        return matchName && matchSpecies;
      });

      document.getElementById('noResult').style.display = filtered.length === 0 ? 'block' : 'none';
      if (filtered.length === 0) {
        document.getElementById('charGrid').innerHTML = '';
        document.getElementById('paginationWrap').innerHTML = '';
        return;
      }
      pager.load(filtered);
    }

    initPage();
  </script>
</body>
</html>
