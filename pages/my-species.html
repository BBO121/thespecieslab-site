<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E8JG7D53T5"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-E8JG7D53T5');

  <link rel="icon" href="../images/favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>내 종족 — 종족연구소</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">종족연구소</a>
      <nav class="header-nav">
        <a href="login.html" class="btn-login">로그인</a>
      </nav>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">

      <div id="pageLoading" class="page-loading">불러오는 중...</div>

      <div id="pageContent" style="display:none;">

        <div class="list-page-header">
          <div>
            <h1 class="list-page-title">내 종족</h1>
            <p class="list-page-count" id="speciesCount"></p>
          </div>
          <a href="species-register.html" class="btn-secondary" id="registerBtn" style="display:none;">+ 종족 등록</a>
        </div>

        <div class="species-grid species-grid--large" id="speciesGrid"></div>
        <div id="paginationWrap"></div>

        <div id="emptyState" class="empty-state-wrap" style="display:none;">
          <div class="empty-state-icon">🐾</div>
          <p class="empty-state-title">등록한 종족이 없어요</p>
          <p class="empty-state-desc" id="emptyStateDesc"></p>
          <div id="emptyStateAction"></div>
        </div>

      </div>

    </main>
  </div>

  <footer class="footer">
    <p class="footer-links"><span>© 2026 종족연구소</span><a href="terms.html">이용약관</a><a href="privacy.html">개인정보처리방침</a><a href="credits.html">운영진</a><a href="mailto:contact@thespecieslab.com">문의</a><a href="https://x.com/thespecieslab" target="_blank" rel="noopener">X</a><span>ver.2.1</span></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/bookmark.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const _qs          = new URLSearchParams(window.location.search);
    const ownerParam   = _qs.get('owner');
    const ownerIdParam = _qs.get('owner_id'); // UUID 기준 (프로필 더보기 전용)

    async function initPage() {
      const user = await getUser();
      if (!user) { window.location.href = 'login.html'; return; }

      let targetUserId = user.id;

      if (ownerIdParam) {
        // login_id → UUID 조회 (URL에 UUID 비노출)
        // search_users는 login_id를 내부 매칭에만 쓰고 값 자체는 응답에 포함하지 않으므로
        // 정확히 일치하는 결과를 서버가 우선순위로 반환한 것 중 첫 건을 사용한다.
        document.getElementById('registerBtn').style.display = 'none';

        const { data } = await searchUsers(ownerIdParam, { limit: 5 });
        const found = (data || [])[0] || null;
        targetUserId = found?.id || null;
        const displayLabel = found?.nickname || ownerIdParam;
        document.querySelector('.list-page-title').textContent = `${displayLabel}님의 종족`;

        if (!targetUserId) {
          document.getElementById('pageLoading').style.display = 'none';
          document.getElementById('pageContent').style.display = 'block';
          document.getElementById('emptyState').style.display = 'flex';
          return;
        }

      } else if (ownerParam) {
        // 닉네임 기준 (기존 호환용)
        document.querySelector('.list-page-title').textContent = `${ownerParam}님의 종족`;
        document.getElementById('registerBtn').style.display = 'none';

        const { data } = await searchUsers(ownerParam, { limit: 5 });
        const found = (data || []).find(u => u.nickname === ownerParam) || null;
        targetUserId = found?.id || null;

        if (!targetUserId) {
          document.getElementById('pageLoading').style.display = 'none';
          document.getElementById('pageContent').style.display = 'block';
          document.getElementById('emptyState').style.display = 'flex';
          return;
        }
      } else {
        // 내 종족 목록
        const role = user.user_metadata?.role;
        if (role === 'species_owner' || isAdminOrStaff(role)) {
          document.getElementById('registerBtn').style.display = 'inline-flex';
        }
      }

      // LABBER는 개체기록실 전용이라 일반 종족 목록에서 숨기지만,
      // 종족주 본인이 자기 "내 종족"을 볼 때는 노출한다 (LABBER 개체 등록 진입점).
      // 타인의 종족 목록(?owner / ?owner_id)에서는 계속 숨긴다.
      const isOwnList = !ownerParam && !ownerIdParam;
      let speciesQuery = sb
        .from('species').select('id, name, image_url, thumbnail_url, default_image_index, is_sensitive, sensitive_note, age_limit')
        .eq('owner_user_id', targetUserId)
        .order('name');
      if (!isOwnList) speciesQuery = speciesQuery.neq('id', LABBER_SPECIES_ID);
      const { data, error } = await speciesQuery;

      document.getElementById('pageLoading').style.display = 'none';
      document.getElementById('pageContent').style.display = 'block';

      if (error || !data || data.length === 0) {
        const isOwnPage = !ownerParam && !ownerIdParam;
        if (isOwnPage) {
          const userRole = user.user_metadata?.role;
          if (userRole !== 'species_owner' && !isAdminOrStaff(userRole)) {
            document.getElementById('emptyStateDesc').innerHTML = '종족 등록은 종족주 승인 후 이용할 수 있어요.<span style="display:block;margin-top:6px;">종족을 만들고 싶다면 먼저 <strong style="color:var(--sky-dark);">종족주 신청</strong>을 해주세요.</span>';
            document.getElementById('emptyStateAction').innerHTML = '<a href="species-apply.html" class="btn-secondary" style="margin-top:12px;">종족주 신청하러 가기</a>';
          } else {
            document.getElementById('emptyStateDesc').textContent = '종족 등록 버튼으로 첫 종족을 만들어보세요.';
          }
        }
        document.getElementById('emptyState').style.display = 'flex';
        return;
      }

      document.getElementById('speciesCount').textContent = `총 ${data.length}개의 종족`;

      pager.load(data);
    }

    function speciesImgHtml(s) {
      const imgSrc = s.thumbnail_url || s.image_url;
      if (s.is_sensitive && speciesHasVisibleRealImage(s)) {
        const ageBadge = s.age_limit > 0 ? `<span class="species-age-badge">${s.age_limit}세 이상</span>` : '';
        return `
        <div style="position:relative; overflow:hidden; border-radius:var(--radius);">
          <div class="species-img blurred" style="background-image:url('${imgSrc}');background-size:cover;background-position:center;"></div>
          <div class="sensitive-overlay" onclick="revealSensitive(this,event)"><div style="display:flex;flex-direction:column;align-items:center;gap:5px;"><svg width="28" height="26" viewBox="0 0 28 26" fill="none"><path d="M14 2L26 24H2L14 2Z" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="14" y1="9" x2="14" y2="16" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="20" r="1.2" fill="#b91c1c"/></svg><span style="color:#b91c1c;font-size:16px;font-weight:700;">민감한 요소</span>${ageBadge}${s.sensitive_note ? '<span class="sensitive-overlay-note">' + s.sensitive_note + '</span>' : ''}<span class="sensitive-overlay-hint">누르면 이미지가 보여요</span></div></div>
        </div>`;
      }
      const displaySrc = resolveSpeciesImage(s);
      if (s.age_limit > 0) {
        // 연령 제한은 썸네일을 가리는 조건이 아니다 — 썸네일은 정상 노출하고
        // 좌측 상단에 연령 배지만 오버레이한다.
        // (민감 요소로 인한 가림은 위 s.is_sensitive 분기에서 이미 별도로 처리됨)
        return `<div class="species-img" style="position:relative; background-image:url('${displaySrc}');background-size:cover;background-position:center;"><span class="species-age-badge species-age-badge--overlay">${s.age_limit}세 이상</span></div>`;
      }
      return `<div class="species-img" style="background-image:url('${displaySrc}');background-size:cover;background-position:center;"></div>`;
    }

    function renderItems(list) {
      document.getElementById('speciesGrid').innerHTML = list.map(s => `
        <a href="species.html?id=${s.id}" class="species-card">
          ${speciesImgHtml(s)}
          <div class="species-info">
            <p class="species-name">${s.name}</p>
          </div>
        </a>
      `).join('');
    }

    const pager = createPager(renderItems);

    function revealSensitive(overlayEl, e) {
      e.stopPropagation(); e.preventDefault();
      const wrap = overlayEl.parentElement;
      wrap.querySelectorAll('.blurred').forEach(el => el.classList.remove('blurred'));
      overlayEl.remove();
    }

    initPage();
  </script>
</body>
</html>
