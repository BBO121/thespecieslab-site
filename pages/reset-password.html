<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E8JG7D53T5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-E8JG7D53T5');
  </script>
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>비밀번호 변경 — 종족연구소</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">종족연구소</a>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">

      <h1 class="auth-title">비밀번호 변경</h1>

      <!-- 정상 recovery 진입 — 새 비밀번호 폼 (기본 숨김, JS가 판별 후 노출) -->
      <div id="resetFormSection" style="display:none;">
        <p class="auth-subtitle">새로 사용할 비밀번호를 입력해주세요</p>

        <form class="auth-form" id="resetForm">
          <div class="form-group">
            <label class="form-label">새 비밀번호</label>
            <input type="password" id="newPassword" class="form-input" placeholder="새 비밀번호 (6자 이상)" required>
          </div>
          <div class="form-group">
            <label class="form-label">새 비밀번호 확인</label>
            <input type="password" id="newPasswordConfirm" class="form-input" placeholder="새 비밀번호 재입력" required>
          </div>
          <p class="auth-error" id="resetError"></p>
          <button type="submit" class="btn-submit" id="resetBtn">비밀번호 변경</button>
        </form>
      </div>

      <!-- 유효하지 않은 접근: 직접 접근 / 일반 로그인 세션만 있는 경우 -->
      <div id="resetInvalidSection" style="display:none;">
        <p class="auth-subtitle">유효하지 않은 접근입니다.</p>
        <p class="auth-switch"><a href="forgot-password.html">비밀번호 찾기로 돌아가기</a></p>
      </div>

      <!-- 만료되었거나 이미 사용된 recovery 링크 -->
      <div id="resetExpiredSection" style="display:none;">
        <p class="auth-subtitle">링크가 만료되었거나 이미 사용된 링크예요. 다시 시도해주세요.</p>
        <p class="auth-switch"><a href="forgot-password.html">비밀번호 찾기로 돌아가기</a></p>
      </div>

      <!-- 변경 완료 -->
      <div id="resetSuccessSection" style="display:none;">
        <p class="auth-subtitle">비밀번호가 변경됐어요! 새 비밀번호로 로그인해주세요.</p>
        <p class="auth-switch"><a href="login.html">로그인하러 가기</a></p>
      </div>

    </div>
  </div>

  <footer class="footer">
    <p class="footer-links"><span>© 2026 종족연구소</span><a href="terms.html">이용약관</a><a href="privacy.html">개인정보처리방침</a><a href="credits.html">운영진</a><a href="mailto:contact@thespecieslab.com">문의</a><a href="https://x.com/thespecieslab" target="_blank" rel="noopener">X</a><span>ver.2.1</span></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>
    const resetFormSection    = document.getElementById('resetFormSection');
    const resetInvalidSection = document.getElementById('resetInvalidSection');
    const resetExpiredSection = document.getElementById('resetExpiredSection');
    const resetSuccessSection = document.getElementById('resetSuccessSection');

    // recovery 판별: PASSWORD_RECOVERY 이벤트가 실제로 발생했을 때만 폼을 보여준다.
    // getSession()의 "세션 존재 여부"는 쓰지 않는다 — 일반 로그인 세션만 있어도
    // 세션은 존재하지만 PASSWORD_RECOVERY 이벤트는 발생하지 않으므로 구분된다.
    (async () => {
      if (window.__recoveryUrlError) {
        resetExpiredSection.style.display = 'block';
        return;
      }

      const session = await window.__recoverySessionPromise;
      if (!session) {
        resetInvalidSection.style.display = 'block';
        return;
      }

      resetFormSection.style.display = 'block';
    })();

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPw     = document.getElementById('newPassword').value;
      const confirmPw = document.getElementById('newPasswordConfirm').value;
      const errorEl   = document.getElementById('resetError');
      const btn       = document.getElementById('resetBtn');

      errorEl.textContent = '';

      if (newPw.length < 6) {
        errorEl.textContent = '비밀번호는 6자 이상이어야 해요.';
        return;
      }
      if (newPw !== confirmPw) {
        errorEl.textContent = '비밀번호가 일치하지 않아요.';
        return;
      }

      btn.textContent = '변경 중...';
      btn.disabled = true;

      const { error } = await updatePassword(newPw);

      if (error) {
        errorEl.textContent = '변경에 실패했어요. 다시 시도해주세요.';
        btn.textContent = '비밀번호 변경';
        btn.disabled = false;
        return;
      }

      // recovery 세션은 변경 완료 후 즉시 종료한다(자동 로그인 상태로 유지하지 않음).
      // 기존 signOut() 헬퍼는 index.html로 강제 이동하는 부수효과가 있어 이 페이지의
      // "완료 메시지 + 로그인 이동 링크" 흐름과 맞지 않으므로, 여기서는 세션 종료만
      // 하는 sb.auth.signOut()을 직접 호출한다(signOut() 함수 자체는 변경하지 않음).
      await sb.auth.signOut();

      resetFormSection.style.display = 'none';
      resetSuccessSection.style.display = 'block';
    });
  </script>
</body>
</html>
