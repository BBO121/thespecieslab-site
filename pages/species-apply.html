<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">종족연구소</a>

  <div class="layout">

    <main class="main">

      <div id="pageLoading" class="page-loading">불러오는 중...</div>

      <div id="pageContent" style="display:none;">

        <div style="padding-top:24px; margin-bottom:20px;">
          <h1 class="list-page-title">종족주 신청</h1>
          <div style="display:flex; align-items:center; justify-content:space-between; margin-top:6px;">
            <p class="list-page-count" id="applyCount" style="margin-top:0;"></p>
            <a href="species-apply-write.html" class="btn-secondary" id="writeBtn">신청하기</a>
          </div>
        </div>

        <div class="shop-tab-row" id="statusTabRow" style="display:none;"></div>

        <div id="applyList"></div>
        <div id="paginationWrap"></div>

        <div id="emptyState" class="empty-state-wrap" style="display:none;">
          <div class="empty-state-icon">📋</div>
          <p class="empty-state-title">신청 내역이 없어요</p>
          <p class="empty-state-desc">종족주가 되고 싶다면 신청해보세요!</p>
        </div>

      </div>

  <footer class="footer">

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/bookmark.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const STATUS_STYLE = {
      '접수됨': 'background:#f1f5f9;color:#64748b',
      '검토중': 'background:#e0f2fe;color:#0284c7',
      '승인됨': 'background:#dcfce7;color:#166534',
      '반려됨': 'background:#fee2e2;color:#dc2626',
    };

    let isAdminUser = false;
    let idToNick = {};
    let allApplications = [];
    let activeTab = '신청';

    // 탭 key → 매핑되는 실제 status 값 (null이면 전체)
    const STATUS_TABS = [
      { key: '신청',     statuses: ['접수됨'] },
      { key: '검토중',   statuses: ['검토중'] },
      { key: '승인완료', statuses: ['승인됨'] },
      { key: '반려됨',   statuses: ['반려됨'] },
      { key: '전체',     statuses: null },
    ];

    function renderStatusTabs() {
      const row = document.getElementById('statusTabRow');
      if (!isAdminUser) { row.style.display = 'none'; return; }

      row.style.display = 'flex';
      row.innerHTML = STATUS_TABS.map(tab => {
        const count = tab.statuses
          ? allApplications.filter(a => tab.statuses.includes(a.status || '접수됨')).length
          : allApplications.length;
        return `<button type="button" class="shop-tab-btn${tab.key === activeTab ? ' active' : ''}" data-tab="${tab.key}">${tab.key} ${count}</button>`;
      }).join('');
    }

    function applyActiveTab() {
      const tab = STATUS_TABS.find(t => t.key === activeTab) || STATUS_TABS[0];
      const filtered = tab.statuses
        ? allApplications.filter(a => tab.statuses.includes(a.status || '접수됨'))
        : allApplications;
      document.getElementById('applyCount').textContent = `총 ${filtered.length}건`;
      document.getElementById('emptyState').style.display = filtered.length === 0 ? 'flex' : 'none';
      pager.load(filtered);
    }

    document.getElementById('statusTabRow').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-tab]');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      renderStatusTabs();
      applyActiveTab();
    });

    async function initPage() {
      const isGuideMode = new URLSearchParams(window.location.search).has('guide');
      const user = await getUser();

      if (!user) {
        if (!isGuideMode) { window.location.href = 'login.html'; return; }
        // 가이드 모드: 비로그인이어도 페이지 표시 (더미 데이터로 진행)
        document.getElementById('pageLoading').style.display = 'none';
        document.getElementById('pageContent').style.display = 'block';
        document.getElementById('emptyState').style.display = 'flex';
        return;
      }

      isAdminUser = isAdminOrStaff(user.user_metadata?.role);

      // 이미 승인된 유저는 신청하기 버튼 숨김
      const isSpeciesOwner = user.user_metadata?.role === 'species_owner';
      if (isSpeciesOwner || isAdminUser) {
        document.getElementById('writeBtn').style.display = 'none';
      }

      // 가이드 모드: 데이터 로드 전에 pageContent 먼저 표시 (guide가 요소를 찾을 수 있도록)
      if (isGuideMode) {
        document.getElementById('pageLoading').style.display = 'none';
        document.getElementById('pageContent').style.display = 'block';
      }

      let query = sb.from('species_applications').select('*').order('created_at', { ascending: false });
      if (!isAdminUser) query = query.eq('user_id', user.id);

      const [{ data, error }, { data: userList }] = await Promise.all([
        query,
        isAdminUser ? sb.rpc('get_all_users') : Promise.resolve({ data: null }),
      ]);
      if (userList) userList.forEach(u => { if (u.id && u.nickname) idToNick[u.id] = u.nickname; });

      document.getElementById('pageLoading').style.display = 'none';
      document.getElementById('pageContent').style.display = 'block';

      if (error || !data || data.length === 0) {
        document.getElementById('emptyState').style.display = 'flex';
        return;
      }

      if (isAdminUser) {
        allApplications = data;
        renderStatusTabs();
        applyActiveTab();
        return;
      }

      document.getElementById('applyCount').textContent = `총 ${data.length}건`;
      pager.load(data);
    }

    function renderItems(list) {
      const container = document.getElementById('applyList');
      container.className = 'notice-list';
      container.innerHTML = list.map(item => {
        const date = new Date(item.created_at).toLocaleDateString('ko-KR', {
          year: 'numeric', month: '2-digit', day: '2-digit'
        }).replace(/\. /g, '.').replace(/\.$/, '');
        const statusStyle = STATUS_STYLE[item.status] || STATUS_STYLE['접수됨'];
        return `
          <a class="notice-item" href="species-apply-detail.html?id=${item.id}">
            <div class="notice-header-left" style="gap:8px;">
              <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;${statusStyle}">${item.status || '접수됨'}</span>
              <span class="notice-title">${item.species_name}</span>
              ${isAdminUser ? `<span style="font-size:12px;color:var(--text-mute);">${idToNick[item.user_id] || item.nickname}</span>` : ''}
            </div>
            <div class="notice-header-right">
              <span class="notice-date">${date}</span>
              <span class="notice-arrow-right">›</span>
            </div>
          </a>
        `;
      }).join('');
    }

    const pager = createPager(renderItems);
    initPage();
  </script>
