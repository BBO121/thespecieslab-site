<html lang="ko">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전체 종족 — 종족연구소</title>
  <meta name="description" content="종족연구소에 등록된 창작 종족의 목록과 각 종족의 기본 정보를 확인할 수 있습니다.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">종족연구소</a>
      <nav class="header-nav">
        <a href="login.html" class="btn-login">로그인</a>
      </nav>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <section class="section">

        <div class="list-page-header">
          <div>
            <h1 class="list-page-title">전체 종족</h1>
            <p class="list-page-count" id="speciesCount">불러오는 중...</p>
          </div>
          <a href="species-register.html" class="btn-secondary" id="btnRegisterSpecies" style="display:none;">+ 종족 등록</a>
        </div>

        <!-- 종족 유형 필터 -->
        <div class="species-filter-chips" id="openFilterChips">
          <button class="species-filter-chip active" data-filter="all">전체보기</button>
          <button class="species-filter-chip" data-filter="open">열린종족</button>
          <button class="species-filter-chip" data-filter="closed">닫힌종족</button>
        </div>

        <!-- 연령 제한 필터 -->
        <div class="species-filter-chips" id="ageFilterChips">
          <button class="species-filter-chip active" data-age-filter="all">전체</button>
          <button class="species-filter-chip" data-age-filter="none">전체 이용 가능만</button>
          <button class="species-filter-chip" data-age-filter="restricted">연령 제한 종족만</button>
        </div>

        <!-- 보기 설정(열 수) — 내 캐릭터와 같은 메뉴(main.js createViewColsMenu), 이 기기·브라우저(localStorage)에만 저장 -->
        <div class="view-cols-row">
          <div class="view-cols" id="viewCols">
            <button type="button" class="view-cols-btn" id="viewColsBtn"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="viewColsPanel">
              <span id="viewColsBtnPrev"></span>보기<span class="view-cols-caret" aria-hidden="true">▼</span>
            </button>
            <div class="view-cols-panel" id="viewColsPanel" role="listbox" aria-label="목록 보기 설정" hidden></div>
          </div>
        </div>

        <!-- 검색 + 정렬 -->
        <div class="list-controls">
          <input type="text" class="list-search" id="searchInput" placeholder="종족 이름으로 검색">
          <select class="list-sort" id="sortSelect">
            <option value="recent">최근 등록순</option>
            <option value="name">이름순</option>
          </select>
        </div>

        <div class="species-grid species-grid--large" id="speciesGrid">
          <p class="page-loading">불러오는 중...</p>
        </div>
        <div id="paginationWrap"></div>
      </section>
    </main>
  </div>

  <footer class="footer">
    <p class="footer-links"><span>© 2026 종족연구소</span><a href="terms.html">이용약관</a><a href="privacy.html">개인정보처리방침</a><a href="credits.html">운영진</a><a href="mailto:contact@thespecieslab.com">문의</a><a href="https://x.com/thespecieslab" target="_blank" rel="noopener">X</a><span>ver.3.1.5</span></p>
  </footer>

  <style>
    .species-filter-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
    .species-filter-chip {
      padding:6px 14px; border:1.5px solid var(--border); border-radius:9px;
      background:#fff; font-size:13px; font-weight:600; color:var(--text-sub);
      cursor:pointer; font-family:inherit; transition:all 0.15s; white-space:nowrap;
    }
    .species-filter-chip:hover  { border-color:var(--sky-dark); color:var(--sky-dark); }
    .species-filter-chip.active { background:var(--sky-dark); border-color:var(--sky-dark); color:#fff; }

    /* 보기 설정 행 — 내 캐릭터와 같이 검색바 위 우측 정렬 */
    .view-cols-row { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom:12px; }

    /* ── 보기 설정(열 수) — data-cols가 있을 때만 화면 크기와 무관하게 선택한 열 수 적용.
       '기본'은 data-cols를 지워 기존 .species-grid--large 반응형 규칙(4/3/2열)을 그대로 따른다. */
    #speciesGrid[data-cols] {
      --sp-cols:4; --sp-gap:14px;
      grid-template-columns:repeat(var(--sp-cols), minmax(0, 1fr));
      gap:var(--sp-gap);
    }
    #speciesGrid[data-cols="2"] { --sp-cols:2; }
    #speciesGrid[data-cols="3"] { --sp-cols:3; }
    #speciesGrid[data-cols="5"] { --sp-cols:5; --sp-gap:12px; }
    #speciesGrid[data-cols="6"] { --sp-cols:6; --sp-gap:12px; }
    #speciesGrid[data-cols="7"] { --sp-cols:7; --sp-gap:10px; }
    #speciesGrid[data-cols="8"] { --sp-cols:8; --sp-gap:10px; }
    @media (max-width:1023px) {
      #speciesGrid[data-cols] { --sp-gap:12px; }
      #speciesGrid[data-cols="5"], #speciesGrid[data-cols="6"] { --sp-gap:10px; }
      #speciesGrid[data-cols="7"], #speciesGrid[data-cols="8"] { --sp-gap:8px; }
    }
    @media (max-width:767px) {
      #speciesGrid[data-cols] { --sp-gap:6px; }
      #speciesGrid[data-cols="2"] { --sp-gap:12px; }
      #speciesGrid[data-cols="3"] { --sp-gap:8px; }
      #speciesGrid[data-cols="6"], #speciesGrid[data-cols="7"], #speciesGrid[data-cols="8"] { --sp-gap:4px; }
    }
    @media (max-width:400px) {
      #speciesGrid[data-cols="2"] { --sp-gap:8px; }
      #speciesGrid[data-cols="3"] { --sp-gap:6px; }
    }

    /* 카드 모서리 — 내 캐릭터와 같은 방식: 목록 폭(100cqi)에서 카드 폭을 계산해 비례 축소(최소 3px, 최대 --radius) */
    #speciesGrid[data-cols] {
      container-type:inline-size;
      --sp-card-w:calc((100cqi - (var(--sp-cols) - 1) * var(--sp-gap)) / var(--sp-cols));
      --sp-card-radius:clamp(3px, calc(var(--sp-card-w) * 0.078), var(--radius));
    }
    #speciesGrid[data-cols] > .species-card { border-radius:var(--sp-card-radius); container-type:inline-size; min-width:0; }
    #speciesGrid[data-cols] .species-sensitive-wrap { border-radius:var(--sp-card-radius) !important; }
    #speciesGrid[data-cols] .species-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* 좁은 카드 — 열 수를 직접 고른 경우에만, 카드 자체 폭 기준(container query)으로 간격·글자를 줄인다.
       '기본' 배치는 기존 스타일 그대로(container 미지정 → 아래 @container 규칙 미적용). */
    @container (max-width:139px) {
      .species-info { padding:8px 8px 9px; }
      .species-name { font-size:12px; }
      .species-age-badge--overlay { top:5px; left:5px; padding:2px 6px; font-size:10px; border-radius:6px; }
      .sensitive-overlay { padding:6px; }
      .sensitive-overlay svg { width:20px; height:19px; }
      .sensitive-overlay-inner { gap:3px; }
      .sensitive-overlay-title { font-size:12px; }
      .sensitive-overlay .species-age-badge { padding:2px 6px; font-size:10px; }
      .sensitive-overlay-note, .sensitive-overlay-hint { font-size:10px; padding:2px 6px; }
    }
    @container (max-width:99px) {
      .species-info { padding:5px 5px 6px; }
      .species-name { font-size:11px; }
      .species-age-badge--overlay { top:3px; left:3px; padding:1px 4px; font-size:9px; border-radius:4px; }
      .sensitive-overlay { padding:3px; }
      .sensitive-overlay svg { width:15px; height:14px; }
      .sensitive-overlay-title { font-size:10px; }
      .sensitive-overlay .species-age-badge { padding:1px 4px; font-size:9px; }
      .sensitive-overlay-note, .sensitive-overlay-hint { display:none; }
    }
    @container (max-width:59px) {
      .species-info { padding:3px 3px 4px; }
      .species-name { font-size:10px; }
      .species-age-badge--overlay { top:2px; left:2px; padding:0 3px; font-size:8px; }
      .sensitive-overlay-title, .sensitive-overlay .species-age-badge { display:none; }
      /* 아주 좁은 카드 — 연령 배지는 "15+"로 줄여 카드 밖으로 넘치지 않게 */
      .species-age-badge--overlay { font-size:0; gap:0; }
      .species-age-badge--overlay::after { content:attr(data-age) "+"; font-size:8px; }
    }
    /* 좁은 카드 안전장치 — 배지가 카드 폭을 넘지 않게 */
    #speciesGrid[data-cols] .species-age-badge--overlay { max-width:calc(100% - 4px); overflow:hidden; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sidebar.js?v=3.1.5"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/bookmark.js"></script>
  <script src="../js/utils.js?v=20260919"></script>
  <script src="../js/achievements.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/main.js?v=20261107"></script>
  <script>
    let isInitialLoad = true;
    let openFilter    = 'all';
    let ageFilter     = 'all';
    let searchController = null;
    let searchToken   = 0;
    const pager = createPager(render, 'paginationWrap', 'page', 28);

    // 보기 설정(열 수) — 내 캐릭터와 같은 메뉴, 저장 키는 따로(species_list_view_cols).
    // 카드 배치(#speciesGrid[data-cols])만 바꾼다 — 페이지당 개수(28)·현재 페이지·검색·필터·정렬은 그대로.
    createViewColsMenu({ gridId: 'speciesGrid', storageKey: 'species_list_view_cols' });

    // 전체 종족을 미리 캐싱해 브라우저에서 필터링하는 대신, 검색어/필터가
    // 바뀔 때마다 searchSpecies()로 서버에 직접 요청한다.
    function loadSpecies() {
      const p = new URLSearchParams(location.search);
      const q      = p.get('q');
      const sort   = p.get('sort');
      const filter = p.get('filter');
      const ageF   = p.get('ageFilter');
      if (q)      document.getElementById('searchInput').value = q;
      if (sort)   document.getElementById('sortSelect').value  = sort;
      if (filter) {
        openFilter = filter;
        document.querySelectorAll('#openFilterChips .species-filter-chip').forEach(b =>
          b.classList.toggle('active', b.dataset.filter === filter));
      }
      if (ageF) {
        ageFilter = ageF;
        document.querySelectorAll('#ageFilterChips .species-filter-chip').forEach(b =>
          b.classList.toggle('active', b.dataset.ageFilter === ageF));
      }
      applyFilter();
    }

    async function applyFilter() {
      const q    = normalizeSearchQuery(document.getElementById('searchInput').value);
      const sort = document.getElementById('sortSelect').value;

      if (searchController) searchController.abort();
      searchController = new AbortController();
      const myToken = ++searchToken;

      const { data, count, error } = await searchSpecies(q, {
        openType: openFilter,
        ageFilter,
        sort,
        limit: 2000,
        signal: searchController.signal,
      });

      if (myToken !== searchToken) return; // 이전 요청보다 늦게 온 응답은 무시

      if (error) {
        document.getElementById('speciesGrid').innerHTML = '<p class="page-loading">불러오기 실패</p>';
        document.getElementById('paginationWrap').innerHTML = '';
        return;
      }

      const list = data;
      const countEl = document.getElementById('speciesCount');
      countEl.textContent = `총 ${count ?? list.length}개의 종족`;

      const grid = document.getElementById('speciesGrid');
      if (!list.length) {
        grid.innerHTML = '<p class="page-loading">검색 결과가 없어요</p>';
        document.getElementById('paginationWrap').innerHTML = '';
        if (q) {
          window.awardAchievement?.('no_species_search');
          const _fc = await window.incrementAchCounter?.('species_search_fail') || 0;
          if (_fc >= 10) window.awardAchievement?.('species_search_fail_10');
          if (_fc >= 5) {
            const _cfc = await window.getCounterValue?.('char_search_fail') || 0;
            if (_cfc >= 5) window.awardAchievement?.('odd_search');
          }
        }
        return;
      }

      if (isInitialLoad) {
        isInitialLoad = false;
        pager.init(list);
      } else {
        const url = new URL(location.href);
        if (q)    url.searchParams.set('q', q);             else url.searchParams.delete('q');
        if (sort) url.searchParams.set('sort', sort);       else url.searchParams.delete('sort');
        if (openFilter !== 'all') url.searchParams.set('filter', openFilter);
        else url.searchParams.delete('filter');
        if (ageFilter !== 'all') url.searchParams.set('ageFilter', ageFilter);
        else url.searchParams.delete('ageFilter');
        url.searchParams.delete('page');
        history.replaceState(null, '', url);
        pager.load(list);
      }
      loadAdSense(); // 종족 목록이 1개 이상 렌더된 뒤에만 광고 로드
    }

    const debouncedApplyFilter = debounce(applyFilter, 300);

    function speciesImgHtml(s) {
      const imgSrc = s.thumbnail_url || s.image_url;
      if (s.is_sensitive && speciesHasVisibleRealImage(s)) {
        const ageBadge = s.age_limit > 0 ? `<span class="species-age-badge">${s.age_limit}세 이상</span>` : '';
        return `
          <div class="species-sensitive-wrap" style="position:relative; overflow:hidden; border-radius:var(--radius);">
            <div class="species-img blurred" style="background-image:url('${imgSrc}'); background-size:cover; background-position:center;"></div>
            <div class="sensitive-overlay" onclick="revealSensitive(this,event)"><div class="sensitive-overlay-inner"><svg width="28" height="26" viewBox="0 0 28 26" fill="none"><path d="M14 2L26 24H2L14 2Z" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="14" y1="9" x2="14" y2="16" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="20" r="1.2" fill="#b91c1c"/></svg><span class="sensitive-overlay-title">민감한 요소</span>${ageBadge}${s.sensitive_note ? '<span class="sensitive-overlay-note">' + s.sensitive_note + '</span>' : ''}<span class="sensitive-overlay-hint">누르면 이미지가 보여요</span></div></div>
          </div>`;
      }
      const displaySrc = resolveSpeciesImage(s);
      if (s.age_limit > 0) {
        // 연령 제한은 썸네일을 가리는 조건이 아니다 — 썸네일은 정상 노출하고
        // 좌측 상단에 연령 배지만 오버레이한다.
        // (민감 요소로 인한 가림은 위 s.is_sensitive 분기에서 이미 별도로 처리됨)
        return `<div class="species-img" style="position:relative; background-image:url('${displaySrc}'); background-size:cover; background-position:center;"><span class="species-age-badge species-age-badge--overlay" data-age="${s.age_limit}">${s.age_limit}세 이상</span></div>`;
      }
      return `<div class="species-img" style="background-image:url('${displaySrc}'); background-size:cover; background-position:center;"></div>`;
    }

    function render(data) {
      const grid = document.getElementById('speciesGrid');
      grid.innerHTML = data.map(s => `
        <a href="species.html?id=${s.id}" class="species-card">
          ${speciesImgHtml(s)}
          <div class="species-info">
            <p class="species-name">${s.name}</p>
          </div>
        </a>
      `).join('');
    }

    function revealSensitive(overlayEl, e) {
      e.stopPropagation();
      e.preventDefault();
      const wrap = overlayEl.parentElement;
      wrap.querySelectorAll('.blurred').forEach(el => el.classList.remove('blurred'));
      overlayEl.remove();
    }

    document.getElementById('openFilterChips').addEventListener('click', e => {
      const btn = e.target.closest('[data-filter]');
      if (!btn) return;
      openFilter = btn.dataset.filter;
      document.querySelectorAll('#openFilterChips .species-filter-chip').forEach(el =>
        el.classList.toggle('active', el === btn)
      );
      isInitialLoad = false;
      applyFilter();
    });

    document.getElementById('ageFilterChips').addEventListener('click', e => {
      const btn = e.target.closest('[data-age-filter]');
      if (!btn) return;
      ageFilter = btn.dataset.ageFilter;
      document.querySelectorAll('#ageFilterChips .species-filter-chip').forEach(el =>
        el.classList.toggle('active', el === btn)
      );
      isInitialLoad = false;
      applyFilter();
    });

    document.getElementById('searchInput').addEventListener('input', debouncedApplyFilter);
    document.getElementById('sortSelect').addEventListener('change', applyFilter);

    async function initPage() {
      const user = await getUser();
      const role = user?.user_metadata?.role;
      if (isAdminOrStaff(role) || role === 'species_owner') {
        document.getElementById('btnRegisterSpecies').style.display = '';
      }
    }

    initPage();
    loadSpecies();
  </script>
</body>
</html>
