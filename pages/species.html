  <!-- 헤더 -->

  <div class="layout">

    <aside class="sidebar" id="sidebar"></aside>

    <!-- 메인 콘텐츠 -->
    <main class="main">

      <!-- 종족 상세 -->
      <section class="species-detail" id="speciesDetail">
        <p class="page-loading">불러오는 중...</p>
      </section>

      <!-- 종족주 가이드 탭 -->
      <section id="guideSection" style="display:none; padding-bottom:16px;">
        <div class="guide-tabs">
          <div class="guide-tab-nav" id="guideTabNav"></div>
          <div class="guide-tab-panels" id="guideTabPanels"></div>
        </div>
      </section>

      <!-- 소속 개체 목록 -->
      <section class="section" id="charactersSection" style="display:none;">
        <div class="section-header">
          <h2>소속 개체 <span class="count-badge" id="charCount">0</span></h2>
          <div style="display:flex; gap:8px; align-items:center;">
            <select id="charSort" class="list-sort" style="margin:0;">
              <option value="recent">최근 등록순</option>
              <option value="name">이름순</option>
              <option value="charNumber">개체번호순</option>
            </select>
            <button type="button" id="charSortDirBtn" class="sort-dir-btn" data-dir="desc" onclick="toggleSortDir()" title="정렬 방향: 내림차순" aria-label="정렬 방향: 내림차순 (누르면 오름차순으로 전환)">
              <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="manageBtn" style="display:none; padding:6px 14px; border:1px solid var(--border); border-radius:8px; background:#fff; font-size:13px; cursor:pointer; color:var(--text-sub);" onclick="toggleManage()">관리</button>
          </div>
        </div>
        <!-- 관리 모드 액션 바 -->
        <div id="manageBar" style="display:none; margin-bottom:12px; padding:10px 14px; background:var(--sky-pale); border-radius:10px; border:1px solid var(--sky-light); align-items:center; gap:12px; flex-wrap:wrap;">
          <span id="selectedCount" style="font-size:13px; color:var(--text-sub);">0개 선택됨</span>
          <button onclick="selectAll()" style="padding:4px 12px; border:1px solid var(--border); border-radius:6px; background:#fff; font-size:12px; cursor:pointer;">전체 선택</button>
          <button onclick="deselectAll()" style="padding:4px 12px; border:1px solid var(--border); border-radius:6px; background:#fff; font-size:12px; cursor:pointer;">전체 해제</button>
          <button id="deleteSelectedBtn" onclick="deleteSelected()" disabled style="padding:4px 12px; border:none; border-radius:6px; background:#ef4444; color:#fff; font-size:12px; cursor:pointer; opacity:0.4;">선택 삭제</button>
          <button onclick="toggleManage()" style="padding:4px 12px; border:1px solid var(--border); border-radius:6px; background:#fff; font-size:12px; cursor:pointer; margin-left:auto;">취소</button>
        </div>
        <!-- 분류 필터 -->
        <div id="categoryFilterSection" style="display:none; margin-bottom:14px;">
          <input type="text" class="list-search" id="categorySearchInput" placeholder="분류명 검색하기" style="width:100%; box-sizing:border-box; margin-bottom:8px;" oninput="filterCategoryButtons(this.value)">
          <div id="categoryFilterBarWrap" style="overflow:hidden;">
            <div id="categoryFilterBar" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
          </div>
          <button type="button" id="categoryFilterMoreBtn" onclick="toggleCategoryFilter()" style="display:none; align-items:center; gap:4px; margin-top:6px; padding:3px 2px; background:none; border:none; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--text-sub); font-family:inherit;">
            <span id="categoryFilterMoreLabel">더보기</span>
            <svg id="categoryFilterChevron" width="10" height="10" viewBox="0 0 12 12" style="transition:transform .15s;"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="character-grid" id="characterGrid"></div>
      </section>

      <!-- 디자인권 목록 -->
      <section class="section" id="slotsSection" style="display:none;">
        <div class="section-header">

  <!-- 소유권 이전 모달 -->
  <div id="transferModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:500; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:16px; padding:24px; width:min(100%, 380px); max-height:80vh; display:flex; flex-direction:column; gap:14px; box-shadow:0 8px 32px rgba(0,0,0,0.18);">
      <h3 style="margin:0; font-size:16px; font-weight:700;">소유권 이전</h3>
      <p id="transferInfo" style="margin:0; font-size:13px; color:var(--text-sub);"></p>
      <input type="text" class="form-input" id="transferSearch" placeholder="닉네임으로 검색..." oninput="filterTransferUsers(this.value)" autocomplete="off">
      <div id="transferUserList" style="border:1px solid var(--border); border-radius:10px; max-height:180px; overflow-y:auto; background:#fff;">

      <p id="transferSelectedDisplay" style="margin:0; font-size:13px; color:var(--sky-deep); display:none;"></p>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn-ghost" onclick="closeTransferModal()">취소</button>
        <button class="btn-secondary" id="transferConfirmBtn" onclick="confirmTransfer()">이전하기</button>
      </div>
    </div>
  </div>

  <!-- 종족 삭제 경고 모달 -->
  <div id="deleteSpeciesModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:600; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:16px; padding:28px 24px; width:min(100%, 440px); max-height:85vh; overflow-y:auto; box-shadow:0 8px 40px rgba(0,0,0,0.22);">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px;">
        <svg width="26" height="24" viewBox="0 0 28 26" fill="none"><path d="M14 2L26 24H2L14 2Z" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="14" y1="9" x2="14" y2="16" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><circle cx="14" cy="20" r="1.3" fill="#b91c1c"/></svg>
        <h3 style="margin:0; font-size:17px; font-weight:700; color:#b91c1c;">종족 삭제 안내</h3>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px; font-size:14px; line-height:1.75; color:var(--text);">
        <p style="margin:0;">종족을 삭제하면 연결된 개체의 종족 정보는 <strong>'알 수 없음'</strong>으로 변경됩니다.</p>
        <p style="margin:0;">삭제 후 기존 개체를 새 종족에 다시 연결하는 요청은 처리되지 않습니다.</p>
        <p style="margin:0;">분양 이력이 있는 종족은 삭제할 수 없습니다.</p>
        <p style="margin:0; font-weight:700; color:#b91c1c;">⚠️ 이 작업은 되돌릴 수 없습니다.</p>
        <p style="margin:0; color:var(--text-sub);">정말 삭제하시겠습니까?</p>
      </div>
      <p id="deleteSpeciesError" style="display:none; margin:0 0 14px; font-size:13px; color:#ef4444; background:#fef2f2; border-radius:8px; padding:10px 12px;"></p>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn-ghost" onclick="closeDeleteModal()">취소</button>
        <button id="deleteSpeciesConfirmBtn" onclick="confirmDeleteSpecies()" style="padding:10px 20px; border:none; border-radius:10px; background:#ef4444; color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;">정말 삭제하기</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/achievements.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/bookmark.js"></script>
  <script src="../js/utils.js?v=20260919"></script>
  <script src="../js/main.js"></script>
  <script src="../js/species-character-list.js"></script>
  <script>
    // AdSense Auto ads 는 js/utils.js 의 loadAdSense() 를 정상 상세 콘텐츠 렌더 완료 후에만 호출한다.

    const speciesId = new URLSearchParams(window.location.search).get('id');

    // LABBER 종족은 일반 종족 상세를 쓰지 않는다 — 종족주(또는 SUPER_ADMIN)가 아니면 개체기록실로 리다이렉트.
    // 종족주는 이 페이지에서 계속 개체 등록/일괄 등록/디자인권/종족 정보 수정을 할 수 있어야 하므로
    // 즉시 리다이렉트하지 않고 loadPage()에서 소유권을 확인한 뒤 판단한다. species row/데이터는 그대로 유지.
    const isLabberSpecies = typeof LABBER_SPECIES_ID !== 'undefined' && String(speciesId) === String(LABBER_SPECIES_ID);

    // 이 계정만 종족 소유권과 무관하게 모든 종족의 개체 등록/일괄 등록/디자인권 등록/
    // 종족 정보 수정/삭제/관리 기능에 접근할 수 있다. role(admin/staff)이 아니라
    // 계정 식별자로 직접 지정 — 다른 admin/staff role 계정에는 적용되지 않는다.
    const SUPER_ADMIN_USER_ID = '78ad7670-847e-4347-b50c-8d8cb2131861';

    // 리치텍스트 렌더링 직전 방어: data:/blob: 이미지만 제거 (Storage URL 등 외부 https 이미지는 그대로 표시)
    // DOMPurify 기본 설정은 img의 data: URI를 막지 않으므로, sanitize와 별개로 이 필터를 함께 적용한다.
    function stripUnsafeRenderedImages(html) {
      if (!html) return html;
      const div = document.createElement('div');
      div.innerHTML = html;
      div.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src') || '';
        if (src.startsWith('data:') || src.startsWith('blob:')) img.remove();
      });
      return div.innerHTML;
    }

    let allChars       = [];
    let isOwner        = false;
    let isSuperAdmin   = false;
    let manageMode     = false;
    let activeCategory = null;
    let siteUserNicks  = new Set();
    let nickToId       = {};
    let idToNick       = {};
    let currentSpecies = null;

    // 소유권 이전 모달 상태
    let transferCharId      = null;
    let transferCharName    = null;
    let transferFromOwner   = null;
    let transferToNick      = null;

    if (!speciesId) {
      applySeoNoIndex();
      document.getElementById('speciesDetail').innerHTML = '<p class="page-loading">잘못된 접근이에요.</p>';
    } else {
      loadPage().catch(e => {
        console.error('[species.html] loadPage 실패:', e);
        document.getElementById('speciesDetail').innerHTML = '<p class="page-loading">정보를 불러오지 못했어요. 잠시 후 다시 시도해주세요.</p>';
      });
    }

    async function loadPage() {
      const user = await getUser();
      const userNickname = user?.user_metadata?.display_name || user?.user_metadata?.nickname || null;
      isSuperAdmin = user?.id === SUPER_ADMIN_USER_ID;

      // 종족 정보
      const { data: s, error } = await sb
        .from('species')
        .select('*')
        .eq('id', speciesId)
        .single();

      if (error || !s) {
        // 없는 종족(행 없음)일 때만 noindex — 네트워크 등 일시 오류에는 걸지 않는다.
        if (isSeoRowNotFound(error, s)) applySeoNoIndex();
        document.getElementById('speciesDetail').innerHTML = `
          <div style="text-align:center; padding:48px 24px;">
            <p style="font-size:32px; margin:0 0 14px;">🔍</p>
            <h2 style="font-size:18px; font-weight:700; color:var(--text); margin:0 0 10px;">알 수 없는 종족</h2>
            <p style="font-size:14px; color:var(--text-sub); line-height:1.8; margin:0 0 24px;">
              이 종족은 삭제되었거나 더 이상 확인할 수 없습니다.<br>
              삭제된 종족은 복구할 수 없으며, 기존 개체와의 재연결도 지원되지 않습니다.
            </p>
            <a href="species-list.html" class="btn-secondary">종족 목록으로</a>
          </div>
        `;
        return;
      }

      currentSpecies = s;
      document.title = `${s.name} — 종족연구소`;

      // SEO 메타 — 실제 조회된 종족 데이터 기준. 민감 표시(is_sensitive) 종족의 실제 이미지는
      // 화면에서도 블러 처리되므로 og:image 로 쓰지 않고 사이트 기본 이미지를 쓴다.
      const seoSpeciesImg = (!s.is_sensitive && !s.default_image_index && /^https?:\/\//.test(s.image_url || '')) ? s.image_url : null;
      applySeoMeta({
        title: `${s.name} — 종족연구소`,
        description: seoPlainText(s.description) || `${s.name} 종족의 정보와 소속 개체를 종족연구소에서 확인해보세요.`,
        canonicalPath: `/pages/species.html?id=${encodeURIComponent(s.id)}`,
        image: seoSpeciesImg,
      });

      const speciesUserId = user?.id || null;
      isOwner = !!(speciesUserId && s.owner_user_id && speciesUserId === s.owner_user_id);

      // LABBER 종족: 종족주(또는 SUPER_ADMIN)만 이 상세 페이지를 사용한다 (개체 등록 등 관리용).
      // 그 외에는 개체기록실로 보낸다. species row/데이터는 그대로 유지.
      if (isLabberSpecies && !(isOwner || isSuperAdmin)) {
        window.location.replace('labber-records.html');
        return;
      }

      // 사이트 유저 목록 로드 (닉네임 최신화 + 오프사이트 판별용)
      const { data: userList } = await sb.rpc('get_all_users');
      if (userList) userList.forEach(u => {
        if (u.nickname) siteUserNicks.add(u.nickname);
        if (u.nickname && u.id) { nickToId[u.nickname] = u.id; idToNick[u.id] = u.nickname; }
      });

      const registeredDate = new Date(s.created_at).toLocaleDateString('ko-KR', {
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).replace(/\. /g, '.').replace(/\.$/, '');

      const fields = s.custom_fields?.length
        ? s.custom_fields.map(f => `<span class="field-tag">${f}</span>`).join('')
        : '';

      const ownerDisplayNick = s.owner_user_id
        ? (idToNick[s.owner_user_id] || s.owner_nickname)
        : s.owner_nickname;

      // 제휴종족 사전 조회
      let affiliatedHtml = '';
      if (s.affiliated_species?.length) {
        const internalIds = s.affiliated_species.filter(a => a.type === 'internal').map(a => a.species_id);
        const internalMap = {};
        if (internalIds.length) {
          const { data: spData } = await sb.from('species').select('id, name, image_url, thumbnail_url, age_limit, default_image_index, is_sensitive, sensitive_note').in('id', internalIds);
          (spData || []).forEach(sp => { internalMap[sp.id] = sp; });
        }
        const items = s.affiliated_species.map(item => {
          if (item.type === 'internal') {
            const sp = internalMap[item.species_id];
            if (!sp) return '';
            // 연령 제한은 이미지 가림 조건이 아니다 — 썸네일은 노출하고 좌상단에 연령 배지만.
            // 민감 요소가 있으면 기존 정책대로 블러(칩은 링크라 클릭 노출 대신 블러만, 상세에서 해제).
            const spImg = `<img src="${resolveSpeciesImage(sp)}" style="width:100%; height:100%; object-fit:cover;">`;
            let chipInner;
            if (sp.is_sensitive && speciesHasVisibleRealImage(sp)) {
              chipInner = `<div style="position:relative; width:100%; height:100%;">
                  <img src="${resolveSpeciesImage(sp)}" style="width:100%; height:100%; object-fit:cover; filter:blur(7px);">
                  <span style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#b91c1c; font-size:15px; font-weight:800;">!</span>
                </div>`;
            } else if (sp.age_limit > 0) {
              chipInner = `<div style="position:relative; width:100%; height:100%;">
                  ${spImg}
                  <span class="species-age-badge species-age-badge--overlay" style="top:3px; left:3px; font-size:9px; padding:1px 4px; box-shadow:none;">${sp.age_limit}세</span>
                </div>`;
            } else {
              chipInner = spImg;
            }
            return `<a href="species.html?id=${item.species_id}" style="display:flex; flex-direction:column; align-items:center; gap:6px; text-decoration:none; color:inherit; min-width:60px; max-width:72px;">
              <div style="width:56px; height:56px; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:#f1f5f9; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
                ${chipInner}
              </div>
              <span style="font-size:12px; color:var(--text); font-weight:500; text-align:center; word-break:break-all; line-height:1.4;">${sp.name}</span>
            </a>`;
          } else {
            return `<div style="display:flex; flex-direction:column; align-items:center; gap:6px; min-width:60px; max-width:72px;">
              <div style="width:56px; height:56px; border-radius:10px; border:1px solid var(--border); background:#f1f5f9; display:flex; align-items:center; justify-content:center; color:var(--text-mute); font-size:20px; flex-shrink:0;">—</div>
              <span style="font-size:12px; color:var(--text); font-weight:500; text-align:center; word-break:break-all; line-height:1.4;">${item.name}</span>
            </div>`;
          }
        }).filter(Boolean);
        if (items.length) {
          affiliatedHtml = `
        <div style="margin-bottom:28px; background:#fff; border-radius:10px; border:1px solid var(--border); padding:14px 16px;">
          <p style="font-size:13px; font-weight:700; color:var(--text); margin:0 0 12px;">제휴종족</p>
          <div style="display:flex; flex-wrap:wrap; gap:16px;">
            ${items.join('')}
          </div>
        </div>`;
        }
      }

      document.getElementById('speciesDetail').innerHTML = `
        <div class="species-detail-top">
          ${s.is_sensitive && speciesHasVisibleRealImage(s, { thumb: false }) ? `
          <div style="position:relative; overflow:hidden; border-radius:var(--radius);">
            <div class="species-detail-img blurred" style="background-image:url('${s.image_url}'); background-size:contain; background-position:center; background-repeat:no-repeat;"></div>
            <div class="sensitive-overlay" onclick="revealSensitive(this,event)"><div style="display:flex;flex-direction:column;align-items:center;gap:5px;"><svg width="28" height="26" viewBox="0 0 28 26" fill="none"><path d="M14 2L26 24H2L14 2Z" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="14" y1="9" x2="14" y2="16" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="20" r="1.2" fill="#b91c1c"/></svg><span style="color:#b91c1c;font-size:16px;font-weight:700;">민감한 요소</span>${s.sensitive_note ? '<span class="sensitive-overlay-note">' + s.sensitive_note + '</span>' : ''}<span class="sensitive-overlay-hint">누르면 이미지가 보여요</span></div></div>
          </div>` : `
          <div class="species-detail-img" style="background-image:url('${resolveSpeciesImage(s, { thumb: false })}'); background-size:contain; background-position:center; background-repeat:no-repeat;"></div>`}
          <div class="species-detail-info">
            <div class="breadcrumb">
              <a href="index.html">홈</a>
              <span>/</span>
              <a href="species-list.html">전체 종족</a>
              <span>/</span>
              <span>${s.name}</span>
            </div>
            <div class="species-detail-name-row">
              <h1 class="species-detail-name">
                ${s.name}
                ${s.open_type === 'open'   ? '<span class="species-type-badge species-type-badge--open">열린종족</span>'   : ''}
                ${s.open_type === 'closed' ? '<span class="species-type-badge species-type-badge--closed">닫힌종족</span>' : ''}
              </h1>
              <button type="button" id="speciesBookmarkBtn" class="bookmark-toggle-btn">☆ 북마크</button>
            </div>
            ${s.age_limit > 0 ? `<p class="species-age-notice">${s.age_limit}세 이상 가능 종족</p>` : ''}
            <div class="species-detail-meta">
              <div class="meta-item">
                <span class="meta-label">종족주</span>
                <span class="meta-value">${ownerDisplayNick
                  ? (s.owner_user_id
                      ? `<a href="profile.html?user=${s.owner_user_id}" class="meta-link">${ownerDisplayNick}</a>`
                      : ownerDisplayNick)
                  : '—'}</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">등록일</span>
                <span class="meta-value">${registeredDate}</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">개체 수</span>
                <span class="meta-value" id="charCountMeta">—</span>
              </div>
              ${s.link ? `
              <div class="meta-item">
                <span class="meta-label">연관링크</span>
                <span class="meta-value"><a href="${s.link}" target="_blank" rel="noopener noreferrer" class="meta-link">${s.link}</a></span>
              </div>` : ''}
              ${s.design_rights ? `
              <div class="meta-item">
                <span class="meta-label">디자인권</span>
                <span class="meta-value">${s.design_rights}</span>
              </div>` : ''}
            </div>
            ${(isOwner || isSuperAdmin) ? `
            <div class="species-detail-actions">
              <a href="character-register.html?species_id=${speciesId}&species=${encodeURIComponent(s.name)}" class="btn-secondary">개체 등록</a>
              <a href="bulk-import.html?species_id=${speciesId}&species=${encodeURIComponent(s.name)}" class="btn-ghost">일괄 등록</a>
              <a href="slot-register.html?species_id=${speciesId}&species=${encodeURIComponent(s.name)}" class="btn-ghost">디자인권 등록</a>
              <a href="species-edit.html?id=${speciesId}" class="btn-ghost">종족 정보 수정</a>
              <button onclick="deleteSpecies()" class="btn-danger" style="grid-column: 1 / -1;">종족 삭제</button>
            </div>` : ''}
          </div>
        </div>

        <div style="margin-bottom:28px; padding:14px 16px; background:var(--sky-pale); border-radius:10px; border:1px solid var(--sky-light);">
          <p style="font-size:13px; font-weight:700; color:var(--text); margin:0 0 8px;">📜 분양 규칙</p>
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${[['재분양', s.allow_resale], ['무료분양', s.allow_free_adoption], ['유료/경매', s.allow_paid_adoption], ['기타분양', s.allow_other_adoption]].map(([label, val]) =>
              `<div style="display:flex; gap:8px; align-items:center; font-size:13px;"><span style="color:var(--text-sub); width:64px; flex-shrink:0;">${label}</span><span style="font-weight:600; color:${val !== false ? 'var(--sky-deep)' : '#ef4444'};">${val !== false ? '가능' : '불가능'}</span></div>`
            ).join('')}
          </div>
        </div>

        ${affiliatedHtml}

        ${s.description ? `
        <div class="species-desc-full">
          <div class="species-detail-desc ql-display">${typeof DOMPurify!=='undefined' ? DOMPurify.sanitize(stripUnsafeRenderedImages(s.description)) : s.description}</div>
        </div>` : ''}

        ${fields ? `
        <div class="species-fields">
          <h3 class="species-fields-title">개체 항목</h3>
          <div class="species-fields-list">${fields}</div>
        </div>` : ''}
      `;

      initBookmarkButton('speciesBookmarkBtn', 'species', Number(speciesId));

      // 종족주 가이드 탭
      if (s.guide?.length) {
        const guideLabels = { worldview: '세계관', settings: '설정', design_guide: '디자인 가이드', tos: '종족용 TOS' };
        const tabNav    = document.getElementById('guideTabNav');
        const tabPanels = document.getElementById('guideTabPanels');

        s.guide.forEach((g, i) => {
          const label = g.type === 'custom' ? g.title : guideLabels[g.type];

          const btn = document.createElement('button');
          btn.className = 'guide-tab-btn';
          btn.textContent = label;
          btn.onclick = () => switchGuideTab(i);
          tabNav.appendChild(btn);

          const panel = document.createElement('div');
          panel.className = 'guide-tab-panel';
          panel.innerHTML = `
            ${g.image_url ? `<img class="guide-panel-img" src="${g.image_url}" alt="${label}">` : ''}
            ${g.content ? `<div class="guide-section-text ql-display">${typeof DOMPurify!=='undefined' ? DOMPurify.sanitize(stripUnsafeRenderedImages(g.content)) : g.content}</div>` : ''}
          `;
          tabPanels.appendChild(panel);
        });

        document.getElementById('guideSection').style.display = '';
      }

      // 소속 개체 — 목록/정렬/분류필터/관리(선택삭제) 로직은 공통 모듈(js/species-character-list.js).
      // LABBER 개체기록실(labber-records.html)과 동일한 코드를 공유한다.
      await window.SpeciesCharList.mount({
        speciesName: s.name,
        canManage:   isOwner || isSuperAdmin,
        idToNick,
        onCount: (n) => {
          const countEl = document.getElementById('charCountMeta');
          if (countEl) countEl.textContent = `${n}마리`;
        },
      });

      // 디자인권 섹션
      const { data: slots } = await sb
        .from('slots')
        .select('id, name, slot_number, owner_user_id, owner_name, thumbnail_url, image_url, status, use_request_status')
        .eq('species_id', speciesId)
        .order('slot_number', { ascending: true, nullsFirst: false });

      const visibleSlots = (slots || []).filter(sl => sl.status === 'active' || sl.status === 'used');
      if (visibleSlots.length > 0 || isOwner || isSuperAdmin) {
        document.getElementById('slotsSection').style.display = '';
        renderSlots(visibleSlots);
      }

      // 종족 상세 조회 업적 (로그인 유저만, 고유 조회 기준)
      if (speciesUserId) {
        const _sv = await window.trackSpeciesView?.(parseInt(speciesId)) || 0;
        if (_sv >= 10) window.awardAchievement?.('species_view_10');
        if (_sv >= 30) window.awardAchievement?.('species_view_30');
        if (_sv >= 50) window.awardAchievement?.('species_view_50');

        // 관심 감사합니다? — 타인 종족 재방문 카운터
        if (!isOwner) {
          const _rc = await window.incrementAchCounter?.(`species_revisit_${speciesId}`) || 0;
          if (_rc >= 10) window.awardAchievement?.('species_revisit_10');
        }
      }

      // 정상 상세 콘텐츠 렌더링에 필요한 모든 비동기 로딩이 성공적으로 끝난 시점에만 광고를 로드한다.
      loadAdSense();
    }

    function renderSlots(list) {
      document.getElementById('slotCount').textContent = list.length;
      const grid = document.getElementById('slotGrid');
      if (!list.length) {
        grid.innerHTML = '<p class="page-loading">등록된 디자인권이 없어요.</p>';
        return;
      }
      grid.innerHTML = list.map(sl => {
        const isUsed    = sl.status === 'used';
        const isPending = sl.use_request_status === 'pending';
        let badge = '';
        if (isUsed)    badge = '<span style="font-size:10px;font-weight:700;color:#64748b;background:#f1f5f9;border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:4px;">사용완료</span>';
        if (isPending) badge = '<span style="font-size:10px;font-weight:700;color:#92400e;background:#fffbeb;border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:4px;">승인대기</span>';
        return `
        <a href="slot.html?id=${sl.id}" class="character-card" style="${isUsed ? 'opacity:0.5;' : ''}">
          <div class="character-img" ${(sl.thumbnail_url || sl.image_url) ? `style="background-image:url('${sl.thumbnail_url || sl.image_url}'); background-size:cover; background-position:center;"` : ''}></div>
          <div class="character-info">
            <p class="character-name">${sl.name}${badge}</p>
            <p class="character-species">${sl.slot_number || ''}</p>
            <p class="character-owner">소유주: ${sl.owner_user_id ? (idToNick[sl.owner_user_id] || '(알 수 없음)') : (sl.owner_name || '—')}</p>
          </div>
        </a>`;
      }).join('');
    }


    function revealSensitive(overlayEl, e) {
      e.stopPropagation();
      e.preventDefault();
      const wrap = overlayEl.parentElement;
      wrap.querySelectorAll('.blurred').forEach(el => el.classList.remove('blurred'));
      overlayEl.remove();
    }


    // ── 소유권 이전 모달 ──────────────────────
    function openTransferModal(charId, charName, currentOwner) {
      transferCharId    = charId;
      transferCharName  = charName;
      transferFromOwner = currentOwner;
      transferToNick    = null;

      document.getElementById('transferInfo').textContent = `"${charName}" — 현재 소유주: ${currentOwner}`;
      document.getElementById('transferSearch').value = '';
      document.getElementById('transferUserList').innerHTML = '<p style="padding:12px; color:var(--text-mute); font-size:13px;">닉네임을 입력하세요</p>';
      document.getElementById('transferSelectedDisplay').style.display = 'none';
      document.getElementById('transferConfirmBtn').textContent = '이전하기';
      document.getElementById('transferConfirmBtn').disabled = false;
      document.getElementById('transferModal').style.display = 'flex';
    }

    function closeTransferModal() {
      document.getElementById('transferModal').style.display = 'none';
    }

    function filterTransferUsers(q) {
      const el = document.getElementById('transferUserList');
      if (!q) {
        el.innerHTML = '<p style="padding:12px; color:var(--text-mute); font-size:13px;">닉네임을 입력하세요</p>';
        return;
      }
      const qLow = q.toLowerCase();
      const matched = [...siteUserNicks].filter(nick => nick.toLowerCase().includes(qLow)).slice(0, 20);
      if (!matched.length) {
        el.innerHTML = '<p style="padding:12px; color:var(--text-mute); font-size:13px;">일치하는 유저가 없어요</p>';
        return;
      }
      el.innerHTML = matched.map(nick => `
        <div onclick="selectTransferUser('${nick}')" id="tItem_${nick.replace(/'/g,'')}"
          style="padding:10px 14px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--border); transition:background 0.1s;"
          onmouseover="this.style.background='var(--sky-pale)'" onmouseout="this.style.background= transferToNick==='${nick}' ? 'var(--sky-light)' : ''">
          ${nick}
        </div>
      `).join('');
    }

    function selectTransferUser(nick) {
      transferToNick = nick;
      document.querySelectorAll('#transferUserList > div').forEach(el => {
        const isSelected = el.id === `tItem_${nick.replace(/'/g,'')}`;
        el.style.background = isSelected ? 'var(--sky-light)' : '';
        el.style.fontWeight  = isSelected ? '600' : '';
      });
      const disp = document.getElementById('transferSelectedDisplay');
      disp.textContent = `선택됨: ${nick}`;
      disp.style.display = 'block';
    }

    async function confirmTransfer() {
      if (!transferToNick) { alert('이전받을 유저를 선택해주세요.'); return; }
      if (!confirm(`"${transferCharName}"의 소유권을\n${transferFromOwner} → ${transferToNick}\n으로 이전할까요?`)) return;

      const btn = document.getElementById('transferConfirmBtn');
      btn.textContent = '이전 중...';
      btn.disabled = true;

      const { data: updated, error } = await sb.from('characters').update({
        owner_nickname: transferToNick,
        owner_user_id:  nickToId[transferToNick] || null,
        owner_contact:  null,
      }).eq('id', transferCharId).select('id');

      if (error || !updated?.length) {
        alert('이전에 실패했어요: ' + (error?.message || 'DB에 반영되지 않았어요. Supabase에서 SQL을 먼저 실행했는지 확인해주세요.'));
        btn.textContent = '이전하기';
        btn.disabled = false;
        return;
      }

      const char = allChars.find(c => String(c.id) === String(transferCharId));
      await logTransfer({
        character_id:   transferCharId,
        character_name: transferCharName,
        species_name:   char?.species_name || '',
        from_nickname:  transferFromOwner,
        from_user_id:   char?.owner_user_id || null,
        to_nickname:    transferToNick,
        to_user_id:     nickToId[transferToNick] || null,
        method:         '종족주 소유권이전',
      });

      // 로컬 데이터 반영
      if (char) {
        char.owner_nickname = transferToNick;
        char.owner_contact  = null;
      }

      closeTransferModal();
      renderChars();
    }

    function switchGuideTab(idx) {
      const btns   = document.querySelectorAll('.guide-tab-btn');
      const panels = document.querySelectorAll('.guide-tab-panel');
      const isOpen = btns[idx]?.classList.contains('active');
      btns.forEach(b   => b.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      if (!isOpen) {
        btns[idx]?.classList.add('active');
        panels[idx]?.classList.add('active');
      }
    }

    function deleteSpecies() {
      const errEl = document.getElementById('deleteSpeciesError');
      errEl.textContent = '';
      errEl.style.display = 'none';
      const btn = document.getElementById('deleteSpeciesConfirmBtn');
      btn.textContent = '정말 삭제하기';
      btn.disabled = false;
      document.getElementById('deleteSpeciesModal').style.display = 'flex';
    }

    function closeDeleteModal() {
      document.getElementById('deleteSpeciesModal').style.display = 'none';
    }

    async function confirmDeleteSpecies() {
      const btn   = document.getElementById('deleteSpeciesConfirmBtn');
      const errEl = document.getElementById('deleteSpeciesError');

      const showError = (msg) => {
        errEl.textContent = msg;
        errEl.style.display = '';
        btn.textContent = '정말 삭제하기';
        btn.disabled = false;
      };

      btn.textContent = '확인 중...';
      btn.disabled = true;
      errEl.style.display = 'none';

      // currentSpecies 유효성 확인
      if (!currentSpecies?.name || !speciesId) {
        showError('종족 정보를 불러올 수 없어요. 페이지를 새로고침 후 다시 시도해주세요.');
        return;
      }

      // 종족명 trim — 앞뒤 공백이 있을 경우 DB 값과 불일치 방지
      const speciesName = currentSpecies.name.trim();

      // 화면에 로드된 소속 개체 수 (공통 모듈이 보유) — 삭제 전 안전장치용
      const loadedCharCount = window.SpeciesCharList?.getChars().length || 0;

      console.log('[종족 삭제] 시작:', {
        id:          speciesId,
        name:        speciesName,
        nameLength:  speciesName.length,
        charsLoaded: loadedCharCount,
      });

      // ── 1단계: 분양 이력 확인 ──
      const { data: hasAdoptions, error: adoptionError } = await sb
        .rpc('check_species_has_adoptions', { p_species_name: speciesName });

      console.log('[종족 삭제] 1단계 분양 이력:', { hasAdoptions, adoptionError });

      if (adoptionError) {
        showError('분양 이력 확인에 실패했어요: ' + adoptionError.message);
        return;
      }
      if (hasAdoptions === true) {
        showError('이 종족은 분양 이력이 있어 삭제할 수 없어요.');
        return;
      }

      btn.textContent = '삭제 중...';

      // ── 2단계: 소속 개체 species_name → '(알 수 없음)' 업데이트 ──
      const { data: updatedCount, error: charUpdateError } = await sb
        .rpc('nullify_deleted_species_chars', {
          p_species_id:   parseInt(speciesId, 10),
          p_species_name: speciesName,
        });

      console.log('[종족 삭제] 2단계 개체 초기화:', { updatedCount, charUpdateError, allCharsLength: loadedCharCount });

      if (charUpdateError) {
        showError('개체 종족 정보 초기화에 실패했어요: ' + charUpdateError.message);
        return;
      }

      // 개체가 로드되어 있는데 0건 업데이트 → 이름 불일치 가능성, 안전하게 중단
      if (loadedCharCount > 0 && (updatedCount === null || updatedCount === 0)) {
        showError(
          `개체 ${loadedCharCount}마리의 종족 정보를 업데이트하지 못했어요. ` +
          '종족명 불일치 가능성이 있습니다. 삭제를 중단합니다.'
        );
        return;
      }

      // ── 3단계: 종족 삭제 (개체 업데이트 성공 후에만 실행) ──
      const { data: deleted, error: deleteError } = await sb
        .from('species')
        .delete()
        .eq('id', speciesId)
        .select();

      console.log('[종족 삭제] 3단계 종족 삭제:', { deleted, deleteError });

      if (deleteError || !deleted?.length) {
        showError(deleteError?.message || '삭제 권한이 없어요. Supabase DELETE 정책을 확인해주세요.');
        return;
      }

      window.location.href = 'species-list.html';
    }
  </script>
</body>
</html>
